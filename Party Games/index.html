<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Games</title>
<meta name="description" content="Jogos de festa multiplayer — cada um no próprio celular.">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Party Games">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');

:root{
  --bg:#070A12;
  --surface:rgba(20, 27, 45, 0.55);
  --surface2:rgba(30, 41, 67, 0.65);
  --surface3:rgba(255, 255, 255, 0.10);
  --border:rgba(255, 255, 255, 0.12);
  --border-strong:rgba(139, 92, 246, 0.45);
  --accent:#8B5CF6;
  --accent-glow:rgba(139, 92, 246, 0.40);
  --accent-ink:#FFFFFF;
  --secondary:#06B6D4;
  --secondary-glow:rgba(6, 182, 212, 0.40);
  --success:#10B981;
  --success-ink:#FFFFFF;
  --danger:#EF4444;
  --danger-glow:rgba(239, 68, 68, 0.40);
  --warning:#F59E0B;
  --text:#F8FAFC;
  --dim:#94A3B8;
  --faint:#64748B;
  --radius:22px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0; background:var(--bg); overflow-x:hidden;}
html{
  min-height:100vh;
}
body{
  color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
  max-width:100%;
  margin:0 auto;
  position:relative;
}

/* ---------- Futuristic Animated Ambient Mesh ---------- */
#bg-veil{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  overflow:hidden;
}
#bg-veil::before{
  content:''; position:absolute; width:350px; height:350px; border-radius:50%;
  top:-50px; left:-50px;
  background:rgba(139, 92, 246, 0.22);
  filter:blur(90px);
  animation:orbDrift1 18s ease-in-out infinite alternate;
}
#bg-veil::after{
  content:''; position:absolute; width:300px; height:300px; border-radius:50%;
  bottom:-40px; right:-40px;
  background:rgba(6, 182, 212, 0.20);
  filter:blur(90px);
  animation:orbDrift2 22s ease-in-out infinite alternate;
}
@keyframes orbDrift1{
  0%{transform:translate(0, 0) scale(1);}
  50%{transform:translate(120px, 80px) scale(1.2);}
  100%{transform:translate(40px, 180px) scale(0.9);}
}
@keyframes orbDrift2{
  0%{transform:translate(0, 0) scale(1);}
  50%{transform:translate(-100px, -90px) scale(1.15);}
  100%{transform:translate(-50px, -200px) scale(0.95);}
}

#app{
  width:100%;
  max-width:1150px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1;
  animation:appFade 0.35s ease-out;
}
@keyframes appFade{
  0%{opacity:0; transform:scale(0.99);}
  100%{opacity:1; transform:scale(1);}
}

/* ---------- Header Glassmorphism ---------- */
header{
  position:sticky; top:0; z-index:10;
  background:rgba(11, 15, 25, 0.65);
  backdrop-filter:blur(24px) saturate(190%); -webkit-backdrop-filter:blur(24px) saturate(190%);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + .85rem) 1.2rem .85rem;
  display:flex; align-items:center; gap:.7rem;
}
.app-icon{
  width:44px; height:44px; border-radius:14px;
  background:linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(139, 92, 246, 0.35));
  border:1px solid rgba(255, 255, 255, 0.3);
  display:flex; align-items:center; justify-content:center; font-size:1.15rem; flex-shrink:0;
  box-shadow:0 0 20px rgba(239, 68, 68, 0.35), 0 0 15px rgba(139, 92, 246, 0.35);
  animation:partyPulse 2.4s ease-in-out infinite;
}
@keyframes partyPulse{
  0%,100%{transform:scale(1) rotate(0deg);}
  50%{transform:scale(1.08) rotate(4deg);}
}
.wordmark{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.25rem; letter-spacing:-.02em; color:var(--text);
  text-shadow:0 0 16px rgba(255,255,255,0.3);
}

.card, .banner, .game-card, .prompt-box, .ticket-chip, input[type=text], textarea, .tab.active,
.player-list li, .result-row, .identity-card, .pick-chip, .scoreboard-row, .team-score-row,
.team-col, .stepper button, .app-icon, .install-btn{
  backdrop-filter:blur(24px) saturate(190%); -webkit-backdrop-filter:blur(24px) saturate(190%);
}

.header-spacer{flex:1;}
.install-btn{
  background:rgba(255, 255, 255, 0.08); border:1px solid var(--border); color:var(--text);
  font-size:.78rem; font-weight:700; padding:.45rem .8rem; border-radius:12px; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
  transition:all .2s ease;
}
.install-btn:hover{background:rgba(255, 255, 255, 0.15); border-color:var(--accent);}

.ticket-chip{
  display:flex; align-items:center; gap:.5rem; background:rgba(255, 255, 255, 0.06);
  border:1px solid var(--border-strong); padding:.4rem .8rem; border-radius:12px;
  box-shadow:0 0 20px rgba(6, 182, 212, 0.2);
}
.ticket-chip .code{font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:.14em; font-size:.95rem; color:var(--secondary);}
.ticket-chip .count{color:var(--dim); font-size:.74rem; font-weight:600;}

main{flex:1; padding:1.2rem 1.2rem 3rem;}

h1.title{
  font-family:'Space Grotesk',sans-serif; font-size:1.65rem; font-weight:700; margin:.2rem 0 .35rem; letter-spacing:-.02em; color:var(--text);
  animation:glassSlideUp 0.4s ease-out both;
}
p.sub{
  color:var(--dim); font-size:.92rem; line-height:1.55; margin:0 0 1.25rem;
  animation:glassSlideUp 0.45s ease-out both;
}

@keyframes glassSlideUp{
  0%{opacity:0; transform:translateY(16px);}
  100%{opacity:1; transform:translateY(0);}
}

/* ---------- Glassmorphism Card Panels ---------- */
.card{
  background:rgba(20, 27, 45, 0.55);
  border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; margin-bottom:1.1rem;
  box-shadow:0 12px 35px rgba(0,0,0,0.45);
  position:relative; overflow:hidden;
  animation:glassSlideUp 0.45s ease-out both;
}
.card::before{
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  pointer-events:none; transition:left 0.7s ease;
}
.card:hover::before{left:100%;}

.banner{
  background:rgba(255, 255, 255, 0.04); border:1px solid var(--border-strong); border-radius:var(--radius); padding:.95rem 1.1rem; margin-bottom:1.1rem; font-size:.88rem; color:var(--dim); line-height:1.55;
  box-shadow:0 6px 24px rgba(0,0,0,0.3);
  animation:glassSlideUp 0.45s ease-out both;
}

/* ---------- Futuristic Glowing Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.55rem;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.02rem;
  padding:.9rem 1.3rem; border-radius:16px; border:1px solid transparent; cursor:pointer;
  width:100%; transition:all .2s cubic-bezier(0.16, 1, 0.3, 1);
  position:relative; overflow:hidden;
}
.btn::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transform:translateX(-100%); transition:transform 0.6s ease;
}
.btn:hover::after{transform:translateX(100%);}
.btn:active{transform:scale(.96);}

.btn-primary{
  background:rgba(139, 92, 246, 0.88); border:1px solid rgba(196, 181, 253, 0.5); color:var(--accent-ink);
  box-shadow:0 8px 25px rgba(139, 92, 246, 0.4);
}
.btn-primary:hover{
  background:rgba(139, 92, 246, 1);
  box-shadow:0 10px 32px rgba(139, 92, 246, 0.65), 0 0 15px rgba(255,255,255,0.3);
  transform:translateY(-2px);
}
.btn-success{
  background:rgba(16, 185, 129, 0.88); border:1px solid rgba(110, 231, 183, 0.5); color:var(--success-ink);
  box-shadow:0 8px 25px rgba(16, 185, 129, 0.4);
}
.btn-success:hover{
  background:rgba(16, 185, 129, 1);
  box-shadow:0 10px 32px rgba(16, 185, 129, 0.65);
  transform:translateY(-2px);
}
.btn-danger{
  background:rgba(239, 68, 68, 0.88); border:1px solid rgba(252, 165, 165, 0.5); color:#FFF;
  box-shadow:0 8px 25px rgba(239, 68, 68, 0.4);
}
.btn-danger:hover{
  background:rgba(239, 68, 68, 1);
  box-shadow:0 10px 32px rgba(239, 68, 68, 0.65);
  transform:translateY(-2px);
}
.btn-warning{
  background:rgba(245, 158, 11, 0.88); border:1px solid rgba(253, 230, 138, 0.5); color:#FFF;
  box-shadow:0 8px 25px rgba(245, 158, 11, 0.4);
}
.btn-warning:hover{
  background:rgba(245, 158, 11, 1);
  box-shadow:0 10px 32px rgba(245, 158, 11, 0.65);
  transform:translateY(-2px);
}
.btn-outline{
  background:rgba(255, 255, 255, 0.06); border:1px solid var(--border-strong); color:var(--text);
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.btn-outline:hover{
  background:rgba(255, 255, 255, 0.12); border-color:var(--accent);
  box-shadow:0 6px 20px rgba(139, 92, 246, 0.3);
  transform:translateY(-2px);
}
.btn-ghost{background:transparent; border-color:transparent; color:var(--dim);}
.btn-ghost:hover{color:var(--text);}
.btn[disabled]{opacity:.4; pointer-events:none;}
.btn-row{display:flex; gap:.7rem;}
.btn-sm{padding:.65rem 1rem; font-size:.88rem; width:auto;}

input[type=text]{
  width:100%; background:rgba(255, 255, 255, 0.05); border:1px solid var(--border-strong); color:var(--text);
  padding:.88rem 1.1rem; border-radius:15px; font-size:1.02rem; font-family:'Plus Jakarta Sans',sans-serif; margin-bottom:.85rem;
  transition:all .2s ease;
}
input[type=text]:focus{outline:none; border-color:var(--accent); background:rgba(255, 255, 255, 0.08); box-shadow:0 0 20px var(--accent-glow);}
label.field-label{display:block; font-size:.76rem; color:var(--dim); margin:.7rem 0 .4rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;}

/* ---------- Animated Tabs ---------- */
.tabs{display:flex; gap:.6rem; margin-bottom:1.1rem;}
.tab{
  flex:1; text-align:center; padding:.7rem; border-radius:14px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.9rem; cursor:pointer; color:var(--dim);
  border:1px solid var(--border); transition:all .2s cubic-bezier(0.16, 1, 0.3, 1);
  background:rgba(255, 255, 255, 0.03);
}
.tab:hover{color:var(--text); border-color:rgba(255, 255, 255, 0.25);}
.tab.active{
  background:rgba(139, 92, 246, 0.25); color:var(--text); border-color:var(--accent);
  box-shadow:0 6px 20px rgba(139, 92, 246, 0.35); transform:translateY(-1px);
}

.player-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.6rem;}
.player-list li{
  display:flex; align-items:center; gap:.7rem; background:rgba(255, 255, 255, 0.05); padding:.75rem 1rem; border-radius:15px; font-weight:700; font-size:.95rem; border:1px solid var(--border);
  animation:glassSlideUp 0.35s ease-out both;
}
.avatar{width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.82rem; flex-shrink:0; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.25);}
.crown{margin-left:auto; font-size:1rem;}

/* ---------- Staggered Animated Game Grid Cards ---------- */
.game-grid{display:grid; grid-template-columns:1fr 1fr; gap:.85rem;}
.game-card{
  background:rgba(20, 27, 45, 0.55);
  border:1px solid var(--border); border-radius:var(--radius); padding:1.15rem 1rem; cursor:pointer;
  transition:all .22s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  position:relative; overflow:hidden;
  animation:glassCardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.game-grid .game-card:nth-child(1){animation-delay:0.02s;}
.game-grid .game-card:nth-child(2){animation-delay:0.05s;}
.game-grid .game-card:nth-child(3){animation-delay:0.08s;}
.game-grid .game-card:nth-child(4){animation-delay:0.11s;}
.game-grid .game-card:nth-child(5){animation-delay:0.14s;}
.game-grid .game-card:nth-child(6){animation-delay:0.17s;}
.game-grid .game-card:nth-child(7){animation-delay:0.20s;}
.game-grid .game-card:nth-child(8){animation-delay:0.23s;}
.game-grid .game-card:nth-child(9){animation-delay:0.26s;}
.game-grid .game-card:nth-child(10){animation-delay:0.29s;}
.game-grid .game-card:nth-child(11){animation-delay:0.32s;}
.game-grid .game-card:nth-child(12){animation-delay:0.35s;}
.game-grid .game-card:nth-child(13){animation-delay:0.38s;}
.game-grid .game-card:nth-child(14){animation-delay:0.41s;}
.game-grid .game-card:nth-child(15){animation-delay:0.44s;}
.game-grid .game-card:nth-child(16){animation-delay:0.47s;}

@keyframes glassCardAppear{
  0%{opacity:0; transform:translateY(24px) scale(0.96);}
  100%{opacity:1; transform:translateY(0) scale(1);}
}

.game-card::before{
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  pointer-events:none; transition:left 0.6s ease;
}
.game-card:hover::before{left:100%;}

.game-card:hover{
  border-color:var(--accent); transform:translateY(-4px) scale(1.02);
  box-shadow:0 14px 35px rgba(139, 92, 246, 0.35), 0 0 15px rgba(6, 182, 212, 0.2);
}
.game-card:active{transform:scale(.96);}
.game-card .badge{
  width:42px; height:42px; border-radius:14px; background:rgba(139, 92, 246, 0.20);
  border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:1.35rem; margin-bottom:.7rem;
  box-shadow:0 0 14px rgba(139, 92, 246, 0.3);
  transition:all .2s ease;
}
.game-card:hover .badge{
  background:rgba(139, 92, 246, 0.4);
  transform:scale(1.1) rotate(4deg);
}
.game-card .gname{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.02rem; color:var(--text);}
.game-card .gdesc{font-size:.75rem; color:var(--dim); margin-top:.3rem; line-height:1.4;}

.prompt-box{
  background:rgba(20, 27, 45, 0.60);
  border:1px solid var(--border-strong); border-radius:var(--radius); padding:1.6rem 1.25rem; text-align:center; margin-bottom:1.2rem;
  box-shadow:0 12px 35px rgba(0,0,0,0.45);
  animation:glassSlideUp 0.4s ease-out both;
}
.prompt-box .eyebrow{font-size:.75rem; color:var(--secondary); text-transform:uppercase; letter-spacing:.12em; font-weight:800; margin-bottom:.6rem;}
.prompt-box .prompt-text{font-family:'Space Grotesk',sans-serif; font-size:1.28rem; font-weight:700; line-height:1.4; color:var(--text);}

.status-line{text-align:center; color:var(--dim); font-size:.85rem; font-weight:600; margin:.7rem 0 1.1rem;}

.result-row{display:flex; align-items:center; gap:.7rem; background:rgba(255, 255, 255, 0.05); padding:.6rem .9rem; border-radius:12px; margin-bottom:.45rem; border:1px solid var(--border);}
.result-row .bar{height:9px; border-radius:6px; background:var(--accent); flex-shrink:0;}
.result-name{font-weight:700; font-size:.9rem; flex:1;}
.result-count{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--secondary); font-size:.88rem;}

.identity-card{display:flex; align-items:center; gap:.7rem; background:rgba(255, 255, 255, 0.05); padding:.8rem .95rem; border-radius:14px; margin-bottom:.55rem; border:1px solid var(--border);}
.identity-card .who{font-weight:700; font-size:.92rem;}
.identity-card .whois{margin-left:auto; font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--success); font-size:.9rem;}
.identity-card.locked .whois{color:var(--faint); letter-spacing:.15em;}

.chip-row{display:flex; flex-wrap:wrap; gap:.55rem; margin:.8rem 0;}
.pick-chip{
  background:rgba(255, 255, 255, 0.05); border:1px solid var(--border-strong); padding:.6rem 1rem; border-radius:13px;
  font-weight:700; font-size:.88rem; cursor:pointer; transition:all .18s ease;
}
.pick-chip:hover{background:rgba(255, 255, 255, 0.12); transform:translateY(-1px);}
.pick-chip.selected{background:rgba(139, 92, 246, 0.88); border-color:rgba(196, 181, 253, 0.6); color:var(--accent-ink); box-shadow:0 4px 16px var(--accent-glow);}
.pick-chip.teamA{border-color:var(--accent); color:var(--accent);}
.pick-chip.teamB{border-color:var(--secondary); color:var(--secondary);}

.scoreboard-row{display:flex; align-items:center; gap:.7rem; background:rgba(255, 255, 255, 0.05); padding:.65rem .95rem; border-radius:14px; margin-bottom:.45rem; border:1px solid var(--border);}
.rank{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--dim); width:1.4rem; font-size:.92rem;}
.score-val{margin-left:auto; font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--secondary); font-size:.95rem;}

.hint{font-size:.8rem; color:var(--dim); text-align:center; margin-top:.55rem;}
.error-msg{color:var(--danger); font-size:.85rem; font-weight:600; margin:-.3rem 0 .7rem;}
.center{text-align:center;}
.mb{margin-bottom:1.1rem;}

.team-score-row{display:flex; justify-content:space-between; align-items:center; background:rgba(255, 255, 255, 0.05); border:1px solid var(--border); border-radius:14px; padding:.85rem 1.1rem; margin-bottom:1.2rem; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.95rem;}
.team-score-row .vs{color:var(--dim); font-size:.75rem;}
.timer-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:3.8rem; text-align:center; margin:.4rem 0; color:var(--accent); font-variant-numeric:tabular-nums; text-shadow:0 0 25px var(--accent-glow);}
.team-col{background:rgba(255, 255, 255, 0.05); border:1px solid var(--border); border-radius:14px; padding:.85rem 1rem; margin-bottom:.7rem; font-size:.88rem; color:var(--dim);}
.team-col h4{margin:0 0 .35rem; font-family:'Space Grotesk',sans-serif; font-size:.92rem; color:var(--text);}
.stepper{display:flex; align-items:center; justify-content:center; gap:1.2rem; margin:.8rem 0 1.1rem;}
.stepper button{width:46px; height:46px; border-radius:14px; border:1px solid var(--border-strong); background:rgba(255, 255, 255, 0.08); color:var(--text); font-size:1.4rem; cursor:pointer; font-family:'Space Grotesk',sans-serif; font-weight:700;}
.stepper .req-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.7rem; min-width:2.8rem; text-align:center; color:var(--secondary);}

/* Custom Game Styles */
.bomb-box{text-align:center; padding:1.8rem 1rem;}
.bomb-icon{font-size:4.8rem; display:inline-block; margin-bottom:.5rem; animation:bombPulse 1.2s ease-in-out infinite;}
@keyframes bombPulse{
  0%,100%{transform:scale(1); filter:drop-shadow(0 0 10px rgba(239,68,68,0.5));}
  50%{transform:scale(1.15); filter:drop-shadow(0 0 30px rgba(239,68,68,0.9));}
}
.tabu-forbidden-list{list-style:none; padding:0; margin:.8rem 0; display:flex; flex-direction:column; gap:.4rem;}
.tabu-forbidden-item{background:rgba(239, 68, 68, 0.15); border:1px solid rgba(239, 68, 68, 0.4); color:#FCA5A5; font-weight:700; padding:.55rem; border-radius:10px; text-align:center; font-size:.95rem;}

.range-slider{width:100%; height:10px; border-radius:5px; background:rgba(255, 255, 255, 0.1); outline:none; -webkit-appearance:none; margin:1.2rem 0;}
.range-slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 0 14px var(--accent-glow);}

.code-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:.5rem; margin-top:.8rem;}
.code-card{aspect-ratio:1.2; background:rgba(255, 255, 255, 0.05); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.72rem; text-align:center; padding:.2rem; cursor:pointer; transition:transform .12s ease;}
.code-card:active{transform:scale(.93);}
.code-card.revealed-red{background:rgba(239,68,68,0.25); border-color:#EF4444; color:#FCA5A5;}
.code-card.revealed-blue{background:rgba(6,182,212,0.25); border-color:#06B6D4; color:#67E8F9;}

async function storageGet(key, shared){
  if(!db) return null;
  try{
    const snap = await db.ref(key).once('value');
    if(!snap.exists()) return null;
    return { key, value: snap.val(), shared };
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(!db) return null;
  try{
    await db.ref(key).set(value);
    return { key, value, shared };
  }catch(e){ console.error('storage.set failed', e); return null; }
}
async function storageList(prefix, shared){
  if(!db) return { keys: [] };
  try{
    const snap = await db.ref().orderByKey().startAt(prefix).endAt(prefix + '\uf8ff').once('value');
    const keys = [];
    snap.forEach(child=>{ keys.push(child.key); });
    return { keys };
  }catch(e){ return { keys: [] }; }
}

function randomDuvidoCategory(){
  const g = room ? room.gameData : null;
  const filterCat = (g && g.filterCat) ? g.filterCat : 'todos';
  let pool = [];
  if(filterCat === 'todos' || !CATEGORIES[filterCat]){
    pool = Object.values(CATEGORIES).flat();
  } else {
    pool = CATEGORIES[filterCat];
  }
  if(!pool || pool.length === 0) pool = Object.values(CATEGORIES).flat();

  const roomUsed = (g && Array.isArray(g.usedDuvidoCategories)) ? g.usedDuvidoCategories : [];

  let available = pool.filter(c => !roomUsed.includes(c));
  if(available.length === 0){
    available = pool;
    if(g && room) g.usedDuvidoCategories = [];
  }

  const pick = available[Math.floor(Math.random() * available.length)];

  if(g && room){
    if(!g.usedDuvidoCategories) g.usedDuvidoCategories = [];
    if(!g.usedDuvidoCategories.includes(pick)){
      g.usedDuvidoCategories.push(pick);
    }
  }

  return pick;
}

function randomQuemSouCharacter(usedInRound = []){
  const g = room ? room.gameData : null;
  const filterCat = (g && g.filterCat) ? g.filterCat : 'todos';
  let pool = CHARACTER_BANK;
  if(filterCat !== 'todos'){
    const filtered = CHARACTER_BANK.filter(c => c && c.cat === filterCat);
    if(filtered.length > 0) pool = filtered;
  }
  if(!pool || pool.length === 0) pool = CHARACTER_BANK;

  const roomUsed = (g && Array.isArray(g.usedCharacters)) ? g.usedCharacters : [];

  let available = pool.filter(c => !roomUsed.includes(c.name) && !usedInRound.includes(c.name));
  if(available.length === 0){
    available = pool.filter(c => !usedInRound.includes(c.name));
    if(g && room) g.usedCharacters = [];
  }
  if(available.length === 0) available = pool;

  const pick = available[Math.floor(Math.random() * available.length)];
  const name = (typeof pick === 'object' && pick !== null) ? (pick.name || String(pick)) : String(pick || 'Personagem Misterioso');

  if(g && room){
    if(!g.usedCharacters) g.usedCharacters = [];
    if(!g.usedCharacters.includes(name)){
      g.usedCharacters.push(name);
    }
  }
  return name;
}

function getTwoRandomQuemSouCharacters(usedInRound = []){
  let charA = randomQuemSouCharacter(usedInRound);
  let charB = randomQuemSouCharacter([...usedInRound, charA]);
  let attempts = 0;
  while(charA === charB && attempts < 15){
    charB = randomQuemSouCharacter([...usedInRound, charA]);
    attempts++;
  }
  return { charA, charB };
}

function randomTop10Theme(){
  const g = room ? room.gameData : null;
  const filterCat = (g && g.filterCat) ? g.filterCat : 'todos';
  let pool = TOP10_THEMES;
  if(filterCat !== 'todos'){
    const filtered = TOP10_THEMES.filter(t => t.cat === filterCat);
    if(filtered.length > 0) pool = filtered;
  }
  if(!pool || pool.length === 0) pool = TOP10_THEMES;

  const roomUsed = (g && Array.isArray(g.usedTop10Themes)) ? g.usedTop10Themes : [];

  let available = pool.filter(t => !roomUsed.includes(t.theme));
  if(available.length === 0){
    available = pool;
    if(g && room) g.usedTop10Themes = [];
  }

  const pick = available[Math.floor(Math.random() * available.length)];

  if(g && room){
    if(!g.usedTop10Themes) g.usedTop10Themes = [];
    if(!g.usedTop10Themes.includes(pick.theme)){
      g.usedTop10Themes.push(pick.theme);
    }
  }

  return pick;
}

  if(diff === 'medio') return `<span class="pick-chip" style="background:rgba(234,179,8,0.2); color:#EAB308; border-color:#EAB308; font-size:.72rem; padding:.2rem .5rem; margin-left:.4rem; cursor:default;">🟡 Médio</span>`;
  if(diff === 'dificil') return `<span class="pick-chip" style="background:rgba(239,68,68,0.2); color:#EF4444; border-color:#EF4444; font-size:.72rem; padding:.2rem .5rem; margin-left:.4rem; cursor:default;">🔴 Difícil</span>`;
  return '';
}

function renderDifficultyFilterHTML(currentDiff){
  const host = isHost();
  const activeDiff = currentDiff || 'todas';
  return `
    <div class="difficulty-filter-wrap mb">
      <label class="field-label" style="margin-bottom:.3rem; text-align:center; display:block;">Nível de Dificuldade</label>
      <div class="chip-row center" style="justify-content:center; margin-top:.2rem;">
        ${DARK_DIFFICULTIES.map(d => `
          <div class="pick-chip ${activeDiff === d.id ? 'selected' : ''}" 
               ${host ? `onclick="setDarkStoriesDifficulty('${d.id}')"` : 'style="opacity:0.7; cursor:default;"'}>
            ${esc(d.name)}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function setDarkStoriesDifficulty(diff){
  if(!isHost()) return;
  await updateRoom(r => {
    if(r.gameData){
      r.gameData.filterDiff = diff;
    }
  });
}

function randomDarkStory(){
  const g = room ? room.gameData : null;
  const filterCat = (g && g.filterCat) ? g.filterCat : 'todos';
  const filterDiff = (g && g.filterDiff) ? g.filterDiff : 'todas';

  let pool = DARK_STORIES;
  if(filterCat !== 'todos'){
    const filteredCat = pool.filter(s => s.cat === filterCat);
    if(filteredCat.length > 0) pool = filteredCat;
  }
  if(filterDiff !== 'todas'){
    const filteredDiff = pool.filter(s => s.diff === filterDiff);
    if(filteredDiff.length > 0) pool = filteredDiff;
  }
  if(!pool || pool.length === 0) pool = DARK_STORIES;

  const roomUsed = (g && Array.isArray(g.usedDarkStories)) ? g.usedDarkStories : [];
  let available = pool.filter(s => !roomUsed.includes(s.id));
  if(available.length === 0){
    available = pool;
    if(g && room) g.usedDarkStories = [];
  }

  const pick = available[Math.floor(Math.random() * available.length)];
  if(g && room){
    if(!g.usedDarkStories) g.usedDarkStories = [];
    if(!g.usedDarkStories.includes(pick.id)){
      g.usedDarkStories.push(pick.id);
    }
  }
  return pick;
}

    if(raw) currentUser = JSON.parse(raw);
  } catch(e){}
}

function sanitizeUserKey(name){
  return 'user:' + name.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '_');
}

function duoKey(p1, p2){
  const clean1 = p1.trim().toLowerCase();
  const clean2 = p2.trim().toLowerCase();
  const sorted = [clean1, clean2].sort();
  return 'duo:' + sorted.join('_v_');
}

async function loginOrCreateUser(name, pin){
  name = name.trim();
  pin = pin.trim();
  if(!name || !pin || pin.length < 4){
    return { error: 'Informe um Apelido e um PIN de 4 dígitos.' };
  }
  const key = sanitizeUserKey(name);
  const res = await storageGet(key, true);
  if(res && res.value){
    const user = typeof res.value === 'string' ? JSON.parse(res.value) : res.value;
    if(user.pin && user.pin !== pin){
      return { error: 'PIN incorreto para este Apelido!' };
    }
    currentUser = { name: user.name, pin: user.pin, wins: user.wins || 0, games: user.games || 0 };
  } else {
    currentUser = { name, pin, wins: 0, games: 0 };
    await storageSet(key, JSON.stringify(currentUser), true);
  }
  localStorage.setItem('party_user_profile', JSON.stringify(currentUser));
  return { success: true };
}

async function addVictoryToPlayer(name){
  if(!name) return;
  const key = sanitizeUserKey(name);
  const res = await storageGet(key, true);
  let user = (res && res.value) ? (typeof res.value === 'string' ? JSON.parse(res.value) : res.value) : { name, pin: '0000', wins: 0, games: 0 };
  user.wins = (user.wins || 0) + 1;
  user.games = (user.games || 0) + 1;
  await storageSet(key, JSON.stringify(user), true);
  if(currentUser && currentUser.name.toLowerCase() === name.toLowerCase()){
    currentUser.wins = user.wins;
    localStorage.setItem('party_user_profile', JSON.stringify(currentUser));
  }
}

async function addDuoVictory(p1, p2){
  if(!p1 || !p2 || p1.toLowerCase() === p2.toLowerCase()) return;
  const key = duoKey(p1, p2);
  const res = await storageGet(key, true);
  let duo = (res && res.value) ? (typeof res.value === 'string' ? JSON.parse(res.value) : res.value) : { p1, p2, wins: 0 };
  duo.wins = (duo.wins || 0) + 1;
  await storageSet(key, JSON.stringify(duo), true);
  await addVictoryToPlayer(p1);
  await addVictoryToPlayer(p2);
}

/* ---------- keys ---------- */
const roomKey = c => `room:${c}`;
const ansKey = (c,r,p) => `room:${c}:ans:${r}:${p}`;
const ansPrefix = (c,r) => `room:${c}:ans:${r}:`;

/* ---------- room persistence helpers ---------- */
async function updateRoom(mutator){
  const res = await storageGet(roomKey(roomCode), true);
  let r = res ? (typeof res.value === 'string' ? JSON.parse(res.value) : res.value) : room;
  mutator(r);
  r.updatedAt = Date.now();
  await storageSet(roomKey(roomCode), JSON.stringify(r), true);
  room = r; lastRoomJSON = JSON.stringify(r);
  render();
}

async function createRoom(name){
  me.id = uid(); me.name = name.trim();
  const code = genCode();
  const r = { code, hostId: me.id, players:[{id:me.id, name:me.name, score:0}],
    phase:'lobby', activeGame:null, gameData:{}, createdAt:Date.now(), updatedAt:Date.now() };
  await storageSet(roomKey(code), JSON.stringify(r), true);
  roomCode = code; room = r; lastRoomJSON = JSON.stringify(r);
  startPolling(); render();
}

async function joinRoom(code, name){
  code = code.toUpperCase().trim();
  const res = await storageGet(roomKey(code), true);
  if(!res){ joinError = 'Sala não encontrada. Confira o código.'; render(); return; }
  let r = typeof res.value === 'string' ? JSON.parse(res.value) : res.value;
  me.id = uid(); me.name = name.trim();
  if(!r.players.find(p=>p.id===me.id)) r.players.push({id:me.id, name:me.name, score:0});
  r.updatedAt = Date.now();
  await storageSet(roomKey(code), JSON.stringify(r), true);
  roomCode = code; room = r; lastRoomJSON = JSON.stringify(r); joinError='';
  startPolling(); render();
}

function leaveRoom(){
  stopPolling();
  clearDuvidoTicker();
  roomCode = null; room = null; lastRoomJSON = null; homeMode = null;
  formLocked = false;
  render();
}

function startPolling(){
  stopPolling();
  if(db && roomCode){
    try {
      const ref = db.ref(roomKey(roomCode));
      roomListener = snap => {
        if(!snap.exists()) return;
        const val = snap.val();
        const parsed = typeof val === 'string' ? JSON.parse(val) : val;
        const jsonStr = JSON.stringify(parsed);
        if(jsonStr !== lastRoomJSON){
          lastRoomJSON = jsonStr;
          room = parsed;
          if(formLocked) updateFormStatus(); else render();
        } else if(!formLocked){
          refreshLiveCount();
        }
      };
      ref.on('value', roomListener);
    } catch(e) { console.error('Firebase realtime listener error', e); }
  }
  pollHandle = setInterval(pollRoom, 1500);
  pollRoom();
}

function stopPolling(){
  if(pollHandle){ clearInterval(pollHandle); pollHandle = null; }
  if(db && roomCode && roomListener){
    try { db.ref(roomKey(roomCode)).off('value', roomListener); } catch(e){}
    roomListener = null;
  }
}

async function pollRoom(){
  if(!roomCode) return;
  const res = await storageGet(roomKey(roomCode), true);
  if(!res) return;
  const parsed = typeof res.value === 'string' ? JSON.parse(res.value) : res.value;
  const jsonStr = JSON.stringify(parsed);
  if(jsonStr !== lastRoomJSON){
    lastRoomJSON = jsonStr;
    room = parsed;
    if(formLocked) updateFormStatus(); else render();
  } else if(!formLocked){
    await refreshLiveCount();
  }
}

async function refreshLiveCount(){
  if(!room || room.phase!=='game') return;
  const g = room.gameData || {};
  let prefix = null, total = room.players.length, label = 'responderam';
  if(room.activeGame==='top' && g.roundId && !g.revealed){
    prefix = ansPrefix(roomCode, g.roundId);
  } else if(room.activeGame==='impostor' && g.stage==='vote'){
    prefix = ansPrefix(roomCode, 'imp'+g.roundId); label = 'votaram';
  }
  if(!prefix) return;
  const listRes = await storageList(prefix, true);
  const newCount = listRes.keys.length;
  if(newCount !== liveCount.answered){
    liveCount = { answered:newCount, total };
    const el = document.getElementById('live-count-text');
    if(el) el.textContent = `${newCount}/${total} ${label}`;
  }
}

  await updateRoom(r=>{
    r.phase='game';
    r.activeGame=gameId;
    const filterCat = (r.gameData && r.gameData.filterCat) || 'todos';
    if(gameId==='top'){
      r.gameData = { roundId:1, filterCat, idx:0, promptText: getTopPromptText(0, filterCat), revealed:false, results:null };
    } else if(gameId==='quemsou'){
      let teamA = (r.gameData && r.gameData.teamA && r.gameData.teamA.length > 0) ? [...r.gameData.teamA] : [];
      let teamB = (r.gameData && r.gameData.teamB && r.gameData.teamB.length > 0) ? [...r.gameData.teamB] : [];
      const activeIds = (r.players || []).map(p => p.id);
      teamA = teamA.filter(id => activeIds.includes(id));
      teamB = teamB.filter(id => activeIds.includes(id));
      activeIds.forEach((pid) => {
        if (!teamA.includes(pid) && !teamB.includes(pid)) {
          if (teamA.length <= teamB.length) teamA.push(pid); else teamB.push(pid);
        }
      });
      r.gameData = { stage:'teams', mode:'teams', filterCat, teamA, teamB, turnIdxA:0, turnIdxB:0, playerAId:null, playerBId:null, characterA:null, characterB:null, individualChars:{} };
    } else if(gameId==='duvido'){
      let teamA = (r.gameData && r.gameData.teamA && r.gameData.teamA.length > 0) ? [...r.gameData.teamA] : [];
      let teamB = (r.gameData && r.gameData.teamB && r.gameData.teamB.length > 0) ? [...r.gameData.teamB] : [];
      const activeIds = (r.players || []).map(p => p.id);
      teamA = teamA.filter(id => activeIds.includes(id));
      teamB = teamB.filter(id => activeIds.includes(id));
      activeIds.forEach((pid) => {
        if (!teamA.includes(pid) && !teamB.includes(pid)) {
          if (teamA.length <= teamB.length) teamA.push(pid); else teamB.push(pid);
        }
      });
      r.gameData = { stage:'teams', filterCat, teamA, teamB, timeLimit:60, turnTeam:'A', turnIdxA:0, turnIdxB:0,
        playerAId:null, playerBId:null, currentPlayerId:null, category:null, required:null, challengerId:null,
        timerStartedAt:null, success:null, scoreA:0, scoreB:0 };
    } else if(gameId==='impostor'){
      r.gameData = { stage:'idle', filterCat, roundId:0, majorityWord:null, impostorWord:null, clue:null, impostorId:null, results:null };
    } else if(gameId==='top10'){
      r.gameData = { stage:'idle', filterCat, themeIndex:null, theme:null, answers:null, readerId:null };
    } else if(gameId==='quiz'){
      r.gameData = { stage:'setup', filterCat, questions:[], currentIndex:0, revealed:false };
    } else if(gameId==='darkstories'){
      const initialReader = (r.players && r.players[0]) ? r.players[0].id : me.id;
      r.gameData = { stage:'idle', filterCat, roundId:0, readerId:initialReader, story:null, lastAnswer:null, winnerId:null, usedDarkStories:[] };
    } else if(gameId==='bomba'){
      const initialHolder = (r.players && r.players[0]) ? r.players[0].id : me.id;
      r.gameData = { stage:'idle', currentPlayerId:initialHolder, prompt:null, timerStartedAt:null, bombDuration:25, explodedPlayerId:null, roundId:0 };
    } else if(gameId==='tabu'){
      const initialExplainer = (r.players && r.players[0]) ? r.players[0].id : me.id;
      r.gameData = { stage:'idle', filterCat, explainerId:initialExplainer, card:null, score:0, roundId:0 };
    } else if(gameId==='frequencia'){
      const initialPsychic = (r.players && r.players[0]) ? r.players[0].id : me.id;
      r.gameData = { stage:'idle', psychicId:initialPsychic, targetPercent:50, spectrum:null, clueText:'', groupGuessPercent:50, result:null, roundId:0 };
    } else if(gameId==='codesecreto'){
      r.gameData = { stage:'setup', teamRed:[], teamBlue:[], spymasterRed:null, spymasterBlue:null, grid:[], turnTeam:'red', scoreRed:0, scoreBlue:0, winnerTeam:null, roundId:0 };
    } else if(gameId==='mentes'){
      const p1 = (r.players && r.players[0]) ? r.players[0].id : me.id;
      const p2 = (r.players && r.players[1]) ? r.players[1].id : p1;
      r.gameData = { stage:'idle', player1Id:p1, player2Id:p2, prompt:null, countdown:null, result:null, roundId:0 };
    } else if(gameId==='desenho'){
      const initialDrawer = (r.players && r.players[0]) ? r.players[0].id : me.id;
      r.gameData = { stage:'idle', filterCat, drawerId:initialDrawer, word:null, canvasData:null, winnerId:null, roundId:0 };
    } else if(gameId==='stop'){
      r.gameData = { stage:'idle', filterCat, letter:null, category:null, stoppedByPlayerId:null, result:null, roundId:0 };
    } else if(gameId==='carreira'){
      r.gameData = { stage:'idle', filterCat, player:null, revealed:false, winnerId:null, roundId:0 };
    } else if(gameId==='nba_carreira'){
      r.gameData = { stage:'idle', player:null, revealed:false, winnerId:null, roundId:0 };
    }
  });
}

/* ---------- Mais Provável ---------- */
function topScreen(){
  const g = room.gameData;
  let inner = `

      <div class="prompt-text">${esc(g.promptText)}</div>

      <div class="pick-chip ${selectedVote===p.id?'selected':''}" onclick="answerTop('${p.id}')">${esc(p.name)}</div>`).join('')}</div>`;
    inner += `<div class="status-line" id="live-count-text">${liveCount.answered}/${room.players.length} responderam</div>`;

    const max = Math.max(1, ...results.map(x=>x.count));
    inner += `<div class="card">` + results.map(x=>`
      <div class="result-row">
        <div style="flex:1;">
          <div class="result-name">${esc(x.name)}</div>

        </div>
        <div class="result-count">${x.count}</div>
      </div>`).join('') + `</div>`;

      inner += renderCategoryFilterHTML(g.filterCat);
      inner += `<button class="btn btn-primary" onclick="nextTopRound()">Próxima</button>`;

async function answerTop(playerId){
  selectedVote = playerId;
  render();
  await storageSet(ansKey(roomCode, room.gameData.roundId, me.id), playerId, true);
}
async function revealTopRound(){
  const g = room.gameData;
  const listRes = await storageList(ansPrefix(roomCode, g.roundId), true);
  const keys = listRes.keys || [];
  const counts = {};
  for(const k of keys){
    const v = await storageGet(k, true);
    if(!v) continue;
    counts[v.value] = (counts[v.value]||0)+1;
  }
  const results = room.players.map(p=>({name:p.name, count:counts[p.id]||0})).sort((a,b)=>b.count-a.count);
  await updateRoom(r=>{ r.gameData.revealed=true; r.gameData.results=results; });
  burstConfetti(24);
}
async function nextTopRound(){
  selectedVote = null;
  await updateRoom(r=>{
    const g = r.gameData;
    g.idx = (g.idx || 0) + 1;
    g.roundId += 1;
    g.promptText = getTopPromptText(g.idx, g.filterCat);
    g.revealed = false;
    g.results = null;
  });
  liveCount = {answered:0, total:room.players.length};
}

function quemsouScreen(){
  const g = room ? room.gameData : null;
  if(!g || g.stage==='teams' || g.stage==='setup') return quemsouSetupScreen();

  if(g.stage==='reveal') return quemsouRevealScreen();

}

        }).join('')}

async function setQuemSouMode(mode){
  if(!isHost()) return;
  await updateRoom(r=>{
    if(!r.gameData) r.gameData = {};
    r.gameData.mode = mode;
  });
}

async function cycleQuemSouTeam(pid){
  await updateRoom(r=>{
    const g = r.gameData || {};
    if(!g.teamA) g.teamA = [];
    if(!g.teamB) g.teamB = [];
    if(g.teamA.includes(pid)){ g.teamA = g.teamA.filter(x=>x!==pid); g.teamB.push(pid); }
    else if(g.teamB.includes(pid)){ g.teamB = g.teamB.filter(x=>x!==pid); }
    else { g.teamA.push(pid); }
  });
}

async function startQuemSouBattle(){
  await updateRoom(r=>{
    const g = r.gameData || {};
    const mode = g.mode || 'teams';
    g.mode = mode;
    g.stage = 'play';

    if(mode === 'individual'){
      const individualChars = {};
      const usedInRound = [];
      (r.players || []).forEach(p => {
        const char = randomQuemSouCharacter(usedInRound);
        usedInRound.push(char);
        individualChars[p.id] = char;
      });
      g.individualChars = individualChars;
    } else {
      if(!g.teamA) g.teamA = [];
      if(!g.teamB) g.teamB = [];
      const activeIds = (r.players || []).map(p => p.id);
      g.teamA = g.teamA.filter(id => activeIds.includes(id));
      g.teamB = g.teamB.filter(id => activeIds.includes(id));
      activeIds.forEach(pid => {
        if(!g.teamA.includes(pid) && !g.teamB.includes(pid)){
          if(g.teamA.length <= g.teamB.length) g.teamA.push(pid);
          else g.teamB.push(pid);
        }
      });

      g.turnIdxA = g.turnIdxA || 0;
      g.turnIdxB = g.turnIdxB || 0;
      g.playerAId = g.teamA[g.turnIdxA % g.teamA.length] || (r.players[0] ? r.players[0].id : null);
      g.playerBId = g.teamB[g.turnIdxB % g.teamB.length] || (r.players[1] ? r.players[1].id : g.playerAId);

      const { charA, charB } = getTwoRandomQuemSouCharacters();
      g.characterA = charA;
      g.characterB = charB;
    }
  });
  burstConfetti(18);
}

async function nextQuemSouRound(){
  await updateRoom(r=>{
    const g = r.gameData || {};
    const mode = g.mode || 'teams';

    if(mode === 'individual'){
      const individualChars = {};
      const usedInRound = [];
      (r.players || []).forEach(p => {
        const char = randomQuemSouCharacter(usedInRound);
        usedInRound.push(char);
        individualChars[p.id] = char;
      });
      g.individualChars = individualChars;
      g.stage = 'play';
    } else {
      if (!g.teamA || g.teamA.length === 0) g.teamA = (r.players || []).map(p=>p.id);
      if (!g.teamB || g.teamB.length === 0) g.teamB = (r.players || []).map(p=>p.id);

      g.turnIdxA = ((g.turnIdxA || 0) + 1) % g.teamA.length;
      g.turnIdxB = ((g.turnIdxB || 0) + 1) % g.teamB.length;
      g.playerAId = g.teamA[g.turnIdxA % g.teamA.length];
      g.playerBId = g.teamB[g.turnIdxB % g.teamB.length];

      const { charA, charB } = getTwoRandomQuemSouCharacters();
      g.characterA = charA;
      g.characterB = charB;
      g.stage = 'play';
    }
  });
  burstConfetti(18);
}

function teamOf(pid){

function duvidoScreen(){

function duvidoTeamsScreen(){
  const g = (room && room.gameData) ? room.gameData : {};
  const host = isHost();
  if(!g.teamA) g.teamA = [];
  if(!g.teamB) g.teamB = [];

  const activeIds = (room.players || []).map(p => p.id);
  g.teamA = g.teamA.filter(id => activeIds.includes(id));
  g.teamB = g.teamB.filter(id => activeIds.includes(id));
  activeIds.forEach(pid => {
    if(!g.teamA.includes(pid) && !g.teamB.includes(pid)){
      if(g.teamA.length <= g.teamB.length) g.teamA.push(pid);
      else g.teamB.push(pid);
    }
  });

  const teamA = g.teamA;
  const teamB = g.teamB;

  return `
    <p class="sub">Monte dois times. A cada rodada, o time adversário escolhe quantos itens a pessoa na roda precisa citar antes que o tempo esgote!</p>
    ${renderCategoryFilterHTML(g.filterCat)}

      ${room.players.map(p=>{
        const cls = teamA.includes(p.id) ? 'teamA' : teamB.includes(p.id) ? 'teamB' : '';
        return `<div class="pick-chip ${cls}" ${host?`onclick="cycleDuvidoTeam('${p.id}')"`:''}>${esc(p.name)}</div>`;
      }).join('')}
    </div>
    <div class="team-col"><h4>Time 1 (${teamA.length})</h4>${teamA.map(id=>esc((room.players.find(p=>p.id===id)||{}).name||'')).join(', ') || 'vazio'}</div>
    <div class="team-col"><h4>Time 2 (${teamB.length})</h4>${teamB.map(id=>esc((room.players.find(p=>p.id===id)||{}).name||'')).join(', ') || 'vazio'}</div>

    <div class="chip-row mb">
      <div class="pick-chip ${g.timeLimit===30?'selected':''}" ${host?`onclick="setDuvidoTime(30)"`:''}>30 segundos</div>

    </div>
    ${host ? `<button class="btn btn-primary" ${(teamA.length<1||teamB.length<1)?'disabled':''} onclick="startDuvidoBattle()">Começar Duvido</button>` : `<div class="banner center" style="margin-top:1rem;"><strong>Times organizados!</strong><br><span class="hint">Esperando o anfitrião(a) iniciar a partida...</span></div>`}
  `;
}
async function cycleDuvidoTeam(pid){
  await updateRoom(r=>{
    const g = r.gameData || {};
    if(!g.teamA) g.teamA = [];
    if(!g.teamB) g.teamB = [];
    if(g.teamA.includes(pid)){ g.teamA = g.teamA.filter(x=>x!==pid); g.teamB.push(pid); }
    else if(g.teamB.includes(pid)){ g.teamB = g.teamB.filter(x=>x!==pid); }
    else { g.teamA.push(pid); }
  });
}
async function setDuvidoTime(t){ await updateRoom(r=>{ if(r.gameData) r.gameData.timeLimit=t; }); }

function adjustDuvidoDraftB(delta){

async function startDuvidoBattle(){
  clearDuvidoTicker();
  duvidoDraftA = 4;
  duvidoDraftB = 4;
  await updateRoom(r=>{
    const g = r.gameData || {};
    if(!g.teamA) g.teamA = [];
    if(!g.teamB) g.teamB = [];
    const activeIds = (r.players || []).map(p => p.id);
    g.teamA = g.teamA.filter(id => activeIds.includes(id));
    g.teamB = g.teamB.filter(id => activeIds.includes(id));
    activeIds.forEach(pid => {
      if(!g.teamA.includes(pid) && !g.teamB.includes(pid)){
        if(g.teamA.length <= g.teamB.length) g.teamA.push(pid);
        else g.teamB.push(pid);
      }
    });

    g.stage = 'challenge';
    g.turnIdxA = 0;
    g.turnIdxB = 0;
    g.playerAId = g.teamA[0] || (r.players[0] ? r.players[0].id : null);
    g.playerBId = g.teamB[0] || (r.players[1] ? r.players[1].id : g.playerAId);
    g.category = randomDuvidoCategory();
    g.currentBid = null;
    g.required = null;
    g.currentPlayerId = null;
    g.challengerId = null;
    g.timerStartedAt = null;
    g.success = null;
    g.scoreA = 0;
    g.scoreB = 0;
  });
  burstConfetti(18);
}

async function markDuvidoResult(success){
  clearDuvidoTicker();
  await updateRoom(r=>{
    const g = r.gameData || {};
    g.stage = 'result';
    g.success = success;
    const targetTeam = teamOf(g.currentPlayerId) || 'A';
    if(success){
      if(targetTeam==='A') g.scoreA = (g.scoreA||0) + 1; else g.scoreB = (g.scoreB||0) + 1;
      const pl = (r.players || []).find(p=>p.id===g.currentPlayerId);
      if(pl) pl.score = (pl.score||0)+1;
    } else {
      const challengerTeam = targetTeam==='A' ? 'B' : 'A';
      if(challengerTeam==='A') g.scoreA = (g.scoreA||0) + 1; else g.scoreB = (g.scoreB||0) + 1;
      const ch = (r.players || []).find(p=>p.id===g.challengerId);
      if(ch) ch.score = (ch.score||0)+1;
    }
  });
  burstConfetti(success ? 24 : 10);
}

async function startImpostorRound(){
  const g = (room && room.gameData) ? room.gameData : {};
  const filterCat = g.filterCat || 'todos';
  const pair = randomImpostorPair();
  const impostorPlayer = room.players[Math.floor(Math.random()*room.players.length)];
  impostorVoted = false; selectedImpostorVote = null;
  const swap = Math.random() < 0.5;
  const majWord = swap ? pair.word2 : pair.word1;
  const impWord = swap ? pair.word1 : pair.word2;

  await updateRoom(r=>{
    const prevRound = (r.gameData && r.gameData.roundId) || 0;
    r.gameData = {
      stage: 'reveal',
      filterCat: filterCat,
      roundId: prevRound + 1,
      majorityWord: majWord,
      impostorWord: impWord,
      clue: pair.clue,
      impostorId: impostorPlayer.id,
      results: null
    };
  });
}
async function openImpostorDiscuss(){ await updateRoom(r=>{ r.gameData.stage='discuss'; }); }
async function openImpostorVote(){
  impostorVoted = false; selectedImpostorVote = null;
  liveCount = { answered:0, total: room.players.length };
  await updateRoom(r=>{ r.gameData.stage='vote'; });
}
async function voteImpostor(pid){
  impostorVoted = true; selectedImpostorVote = pid; render();
  await storageSet(ansKey(roomCode, 'imp'+room.gameData.roundId, me.id), pid, true);
}
async function revealImpostor(){
  const g = room.gameData;
  const listRes = await storageList(ansPrefix(roomCode, 'imp'+g.roundId), true);
  const counts = {};
  for(const k of listRes.keys){
    const v = await storageGet(k, true);
    if(!v) continue;
    counts[v.value] = (counts[v.value]||0)+1;
  }
  const results = room.players.map(p=>({id:p.id, name:p.name, count:counts[p.id]||0})).sort((a,b)=>b.count-a.count);
  const topVoted = results[0];
  const crewWon = !!(topVoted && topVoted.count>0 && topVoted.id===g.impostorId);
  await updateRoom(r=>{
    r.gameData.stage='result';
    r.gameData.results={list:results, crewWon};
    if(crewWon){
      r.players.forEach(p=>{ if(p.id!==r.gameData.impostorId) p.score=(p.score||0)+1; });
    } else {
      const imp = r.players.find(p=>p.id===r.gameData.impostorId);
      if(imp) imp.score=(imp.score||0)+2;
    }
  });
  burstConfetti(26);
}

function addQuizSuggestion(q){

function addQuizCustom(){

function updateQuizAnswer(i, val){ if(quizDraftQuestions[i]) quizDraftQuestions[i].a = val; }

async function startQuizPlay(){

function randomBombaPrompt(){
  const g = room ? room.gameData : null;
  const used = (g && Array.isArray(g.usedBombaPrompts)) ? g.usedBombaPrompts : [];
  let available = BOMBA_PROMPTS.filter(p => !used.includes(p));
  if(available.length === 0){
    available = BOMBA_PROMPTS;
    if(g && room) g.usedBombaPrompts = [];
  }
  const pick = available[Math.floor(Math.random() * available.length)];
  if(g && room){
    if(!g.usedBombaPrompts) g.usedBombaPrompts = [];
    if(!g.usedBombaPrompts.includes(pick)) g.usedBombaPrompts.push(pick);
  }
  return pick;
}

function bombaScreen(){
  const g = room.gameData || {};
  if(g.stage === 'play') checkBombaTimer();
  if(g.stage === 'play') return bombaPlayScreen();
  if(g.stage === 'boom') return bombaBoomScreen();
  return bombaIdleScreen();
}

function checkBombaTimer(){
  const g = room.gameData;
  if(!g || g.stage !== 'play' || !g.timerStartedAt) return;
  const elapsed = (Date.now() - g.timerStartedAt) / 1000;
  if(elapsed >= g.bombDuration && isHost()){
    updateRoom(r=>{
      if(r.gameData && r.gameData.stage === 'play'){
        r.gameData.stage = 'boom';
        r.gameData.explodedPlayerId = r.gameData.currentPlayerId;
      }
    });
  }
}

async function passBomba(){
  const players = room.players || [];
  const currentIdx = players.findIndex(p=>p.id===room.gameData.currentPlayerId);

  const nextPlayerId = players[nextIdx].id;

  await updateRoom(r=>{
    if(r.gameData && r.gameData.stage === 'play'){
      r.gameData.currentPlayerId = nextPlayerId;
    }
  });
}

function randomTabuCard(){
  const g = room ? room.gameData : null;
  const filterCat = (g && g.filterCat) ? g.filterCat : 'todos';
  let pool = TABU_CARDS;
  if(filterCat !== 'todos'){
    const filtered = pool.filter(c => c.cat === filterCat);
    if(filtered.length > 0) pool = filtered;
  }
  const used = (g && Array.isArray(g.usedTabuCards)) ? g.usedTabuCards : [];
  let available = pool.filter(c => !used.includes(c.word));
  if(available.length === 0){
    available = pool;
    if(g && room) g.usedTabuCards = [];
  }
  const pick = available[Math.floor(Math.random() * available.length)];
  if(g && room){
    if(!g.usedTabuCards) g.usedTabuCards = [];
    if(!g.usedTabuCards.includes(pick.word)) g.usedTabuCards.push(pick.word);
  }
  return pick;
}

function get16CodesecretoWords(){
  const g = room ? room.gameData : null;
  const used = (g && Array.isArray(g.usedCodesecretoWords)) ? g.usedCodesecretoWords : [];
  let available = CODENAMES_WORDS.filter(w => !used.includes(w));
  if(available.length < 16){
    available = CODENAMES_WORDS;
    if(g && room) g.usedCodesecretoWords = [];
  }
  const picked = [...available].sort(()=>Math.random() - 0.5).slice(0, 16);
  if(g && room){
    if(!g.usedCodesecretoWords) g.usedCodesecretoWords = [];
    picked.forEach(w => { if(!g.usedCodesecretoWords.includes(w)) g.usedCodesecretoWords.push(w); });
  }
  return picked;
}

async function revealCodesecretoCard(idx){
  await updateRoom(r=>{
    const g = r.gameData;
    if(!g || g.stage !== 'play' || g.grid[idx].revealed) return;

    g.grid[idx].revealed = true;
    const card = g.grid[idx];

    if(card.type === 'red'){
      g.scoreRed = (g.scoreRed || 0) + 1;
      if(g.scoreRed >= 6){ g.stage = 'result'; g.winnerTeam = 'red'; }
    } else if(card.type === 'blue'){
      g.scoreBlue = (g.scoreBlue || 0) + 1;
      if(g.scoreBlue >= 5){ g.stage = 'result'; g.winnerTeam = 'blue'; }
    } else if(card.type === 'assassin'){
      g.stage = 'result';
      g.winnerTeam = (g.turnTeam === 'red') ? 'blue' : 'red';
    } else {
      // Neutro: passa a vez
      g.turnTeam = (g.turnTeam === 'red') ? 'blue' : 'red';
    }
  });
}

function initDesenhoCanvas(isDrawer, savedData){
  const cvs = document.getElementById('gartic-canvas');
  if(!cvs) return;
  const ctx = cvs.getContext('2d');

  if(savedData){
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0); };
    img.src = savedData;
  }

  if(!isDrawer) return;

  let drawing = false;
  let lastX = 0;
  let lastY = 0;

  function getPos(e){
    const rect = cvs.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (cvs.width / rect.width),
      y: (clientY - rect.top) * (cvs.height / rect.height)
    };
  }

  function startDraw(e){
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x; lastY = pos.y;
  }

  function draw(e){
    if(!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = activeDrawColor;
    ctx.lineWidth = activeDrawColor === '#000000' ? 14 : 4;
    ctx.lineCap = 'round';
    ctx.stroke();
    lastX = pos.x; lastY = pos.y;
  }

  function stopDraw(){
    if(!drawing) return;
    drawing = false;
    const dataUrl = cvs.toDataURL();
    updateRoom(r=>{
      if(r.gameData) r.gameData.canvasData = dataUrl;
    });
  }

  cvs.onmousedown = startDraw;
  cvs.onmousemove = draw;
  cvs.onmouseup = stopDraw;

  cvs.ontouchstart = startDraw;
  cvs.ontouchmove = draw;
  cvs.ontouchend = stopDraw;
}

function clearDrawCanvas(){
  const cvs = document.getElementById('gartic-canvas');
  if(cvs){
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    updateRoom(r=>{ if(r.gameData) r.gameData.canvasData = null; });
  }
}

function randomStopCategory(){
  const g = room ? room.gameData : null;
  const used = (g && Array.isArray(g.usedStopCategories)) ? g.usedStopCategories : [];
  let available = STOP_CATEGORIES.filter(c => !used.includes(c));
  if(available.length === 0){
    available = STOP_CATEGORIES;
    if(g && room) g.usedStopCategories = [];
  }
  const pick = available[Math.floor(Math.random() * available.length)];
  if(g && room){
    if(!g.usedStopCategories) g.usedStopCategories = [];
    if(!g.usedStopCategories.includes(pick)) g.usedStopCategories.push(pick);
  }
  return pick;
}

async function startStopRound(){
  const letter = STOP_LETTERS[Math.floor(Math.random() * STOP_LETTERS.length)];
  const category = randomStopCategory();

  await updateRoom(r=>{
    const used = (r.gameData && Array.isArray(r.gameData.usedStopCategories)) ? r.gameData.usedStopCategories : [];
    if(!used.includes(category)) used.push(category);
    r.gameData = {
      stage: 'play',
      letter: letter,
      category: category,
      stoppedByPlayerId: null,
      result: null,
      usedStopCategories: used,
      roundId: (r.gameData && r.gameData.roundId ? r.gameData.roundId : 0) + 1

async function hitStopButton(){
  await updateRoom(r=>{
    if(r.gameData && !r.gameData.stoppedByPlayerId){
      r.gameData.stoppedByPlayerId = me.id;
    }
  });

async function markStopResult(res){
  if(res === 'success') burstConfetti(18);
  await updateRoom(r=>{
    r.gameData.result = res;
    if(res === 'success' && r.gameData.stoppedByPlayerId){
      const p = r.players.find(x=>x.id===r.gameData.stoppedByPlayerId);
      if(p) p.score = (p.score || 0) + 1;
    }
  });
}

function randomNbaPlayer(){
  const g = room ? room.gameData : null;
  const used = (g && Array.isArray(g.usedNbaPlayers)) ? g.usedNbaPlayers : [];
  let available = CARREIRA_NBA.filter(p => !used.includes(p.name));
  if(available.length === 0){
    available = CARREIRA_NBA;
    if(g && room) g.usedNbaPlayers = [];
  }
  const pick = available[Math.floor(Math.random() * available.length)];
  if(g && room){
    if(!g.usedNbaPlayers) g.usedNbaPlayers = [];
    if(!g.usedNbaPlayers.includes(pick.name)) g.usedNbaPlayers.push(pick.name);
  }
  return pick;
}

function nbaCarreiraScreen(){
  const g = room.gameData || {};
  if(g.stage === 'play') return nbaCarreiraPlayScreen();
  return nbaCarreiraIdleScreen();
}

function nbaCarreiraIdleScreen(){
  return `
    <p class="sub center">Descubra qual é o astro da NBA analisando a <strong>trajetória de franquias</strong> por onde ele jogou na carreira!</p>
    <div class="card center mb" style="padding:1.4rem;">
      <div style="font-size:3.5rem; margin-bottom:.3rem;">🏀</div>
      <label class="field-label" style="font-weight:700;">Quem manja tudo de NBA?</label>
    </div>
    ${isHost() ? `<button class="btn btn-warning" style="font-size:1.1rem; padding:1rem;" onclick="startNbaCarreiraRound()">Sortear Astro da NBA</button>` : `<p class="hint center">Aguardando o anfitrião sortear o jogador...</p>`}
  `;
}

async function startNbaCarreiraRound(){
  const p = randomNbaPlayer();
  await updateRoom(r=>{
    const used = (r.gameData && Array.isArray(r.gameData.usedNbaPlayers)) ? r.gameData.usedNbaPlayers : [];
    if(!used.includes(p.name)) used.push(p.name);
    r.gameData = {
      stage: 'play',
      player: p,
      revealed: false,
      winnerId: null,
      usedNbaPlayers: used,
      roundId: (r.gameData && r.gameData.roundId ? r.gameData.roundId : 0) + 1
    };
  });
  burstConfetti(12);
}
