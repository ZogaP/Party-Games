<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0F172A;
  --surface:rgba(30, 41, 59, 0.88);
  --surface2:rgba(51, 65, 85, 0.70);
  --border:rgba(148, 163, 184, 0.16);
  --border-strong:rgba(139, 92, 246, 0.45);
  --accent:#8B5CF6;
  --accent-ink:#FFFFFF;
  --secondary:#06B6D4;
  --success:#10B981;
  --success-ink:#FFFFFF;
  --danger:#EF4444;
  --danger-ink:#FFFFFF;
  --info:#3B82F6;
  --info-ink:#FFFFFF;
  --text:#F8FAFC;
  --dim:#94A3B8;
  --faint:#64748B;
  --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{
  background:var(--bg);
  background-image:radial-gradient(circle at 50% 0%, #1E1B4B 0%, #0F172A 75%);
  background-attachment:fixed;
  min-height:100vh;
}
body{
  background:transparent;
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
  max-width:480px;
  margin:0 auto;
  position:relative;
}
#bg-veil{position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.15), transparent 50%), radial-gradient(ellipse at 20% 80%, rgba(6, 182, 212, 0.12), transparent 50%);}
#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1;}

header{
  position:sticky; top:0; z-index:10; background:rgba(15, 23, 42, 0.85);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + .8rem) 1.1rem .8rem;
  display:flex; align-items:center; gap:.6rem;
}
.app-icon{width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg, #8B5CF6, #06B6D4); border:none;
  display:flex; align-items:center; justify-content:center; font-size:1.15rem; flex-shrink:0;
  box-shadow:0 0 12px rgba(139, 92, 246, 0.5);
  animation:partyPulse 2.4s ease-in-out infinite;}
@keyframes partyPulse{
  0%,100%{transform:scale(1) rotate(0deg);}
  50%{transform:scale(1.08) rotate(4deg);}
}
.wordmark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem; letter-spacing:-.01em; color:var(--text);}

.card, .banner, .game-card, .prompt-box, .ticket-chip, input[type=text], textarea, .tab.active,
.player-list li, .result-row, .identity-card, .pick-chip, .scoreboard-row, .team-score-row,
.team-col, .stepper button, .app-icon, .install-btn{
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.header-spacer{flex:1;}
.install-btn{background:var(--surface2); border:1px solid var(--border-strong); color:var(--text);
  font-size:.78rem; font-weight:600; padding:.4rem .7rem; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif;}

.ticket-chip{display:flex; align-items:center; gap:.5rem; background:var(--surface2);
  border:1px dashed var(--border-strong); padding:.35rem .7rem; border-radius:10px;}
.ticket-chip .code{font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:.12em; font-size:.92rem; color:var(--secondary);}
.ticket-chip .count{color:var(--dim); font-size:.72rem; font-weight:600;}

main{flex:1; padding:1.1rem 1.1rem 2.5rem;}

h1.title{font-family:'Space Grotesk',sans-serif; font-size:1.5rem; font-weight:700; margin:.2rem 0 .3rem; letter-spacing:-.01em; color:var(--text);}
p.sub{color:var(--dim); font-size:.94rem; line-height:1.5; margin:0 0 1.2rem;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.1rem; margin-bottom:1rem;}
.banner{background:var(--surface2); border:1px solid var(--border-strong); border-radius:var(--radius); padding:.85rem 1rem; margin-bottom:1rem; font-size:.85rem; color:var(--dim); line-height:1.5;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:.98rem;
  padding:.8rem 1.2rem; border-radius:12px; border:1px solid transparent; cursor:pointer;

}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg, #8B5CF6, #6366F1); color:var(--accent-ink); box-shadow:0 4px 14px rgba(139,92,246,0.35);}
.btn-success{background:var(--success); color:var(--success-ink);}
.btn-danger{background:var(--danger); color:var(--danger-ink);}
.btn-outline{background:transparent; border-color:var(--border-strong); color:var(--text);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--dim);}
.btn[disabled]{opacity:.4; pointer-events:none;}
.btn-row{display:flex; gap:.6rem;}
.btn-sm{padding:.55rem .85rem; font-size:.85rem; width:auto;}

input[type=text]{
  width:100%; background:var(--surface2); border:1px solid var(--border-strong); color:var(--text);

input[type=text]:focus{outline:none; border-color:var(--accent);}
label.field-label{display:block; font-size:.76rem; color:var(--dim); margin:.6rem 0 .35rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}

.tabs{display:flex; gap:.5rem; margin-bottom:1rem;}
.tab{flex:1; text-align:center; padding:.6rem; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:.88rem; cursor:pointer; color:var(--dim); border:1px solid var(--border);}
.tab.active{background:var(--surface2); color:var(--text); border-color:var(--accent);}

.player-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem;}
.player-list li{display:flex; align-items:center; gap:.6rem; background:var(--surface2); padding:.6rem .8rem; border-radius:11px; font-weight:600; font-size:.92rem;}
.avatar{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.78rem; flex-shrink:0; color:#fff;}
.crown{margin-left:auto; font-size:.95rem;}

.game-grid{display:grid; grid-template-columns:1fr 1fr; gap:.7rem;}
.game-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem .85rem; cursor:pointer; transition:border-color .2s ease;}
.game-card:hover{border-color:var(--accent);}
.game-card:active{transform:scale(.96);}
.game-card .badge{width:34px; height:34px; border-radius:10px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:1.15rem; margin-bottom:.5rem;}
.game-card .gname{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:.92rem;}
.game-card .gdesc{font-size:.72rem; color:var(--dim); margin-top:.2rem; line-height:1.3;}

.prompt-box{background:var(--surface2); border:1px solid var(--border-strong); border-radius:var(--radius); padding:1.4rem 1.1rem; text-align:center; margin-bottom:1.1rem;}
.prompt-box .eyebrow{font-size:.72rem; color:var(--secondary); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-bottom:.5rem;}
.prompt-box .prompt-text{font-family:'Space Grotesk',sans-serif; font-size:1.2rem; font-weight:700; line-height:1.35; color:var(--text);}

.status-line{text-align:center; color:var(--dim); font-size:.83rem; margin:.6rem 0 1rem;}

.result-row{display:flex; align-items:center; gap:.6rem; background:var(--surface2); padding:.55rem .8rem; border-radius:10px; margin-bottom:.4rem;}

.result-name{font-weight:600; font-size:.88rem; flex:1;}
.result-count{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--secondary); font-size:.83rem;}

.identity-card{display:flex; align-items:center; gap:.65rem; background:var(--surface2); padding:.75rem .85rem; border-radius:11px; margin-bottom:.5rem;}
.identity-card .who{font-weight:600; font-size:.9rem;}
.identity-card .whois{margin-left:auto; font-family:'Space Grotesk',sans-serif; font-weight:600; color:var(--success); font-size:.88rem;}
.identity-card.locked .whois{color:var(--faint); letter-spacing:.15em;}

.chip-row{display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0;}
.pick-chip{background:var(--surface2); border:1px solid var(--border-strong); padding:.5rem .85rem; border-radius:10px; font-weight:600; font-size:.85rem; cursor:pointer;}
.pick-chip.selected{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 0 10px rgba(139,92,246,0.4);}
.pick-chip.teamA{border-color:var(--accent); color:var(--accent);}
.pick-chip.teamB{border-color:var(--secondary); color:var(--secondary);}

.scoreboard-row{display:flex; align-items:center; gap:.65rem; background:var(--surface2); padding:.6rem .85rem; border-radius:11px; margin-bottom:.4rem;}
.rank{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--dim); width:1.3rem; font-size:.88rem;}
.score-val{margin-left:auto; font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--secondary); font-size:.9rem;}

.hint{font-size:.78rem; color:var(--dim); text-align:center; margin-top:.5rem;}
.error-msg{color:var(--danger); font-size:.83rem; margin:-.3rem 0 .6rem;}
.center{text-align:center;}
.mb{margin-bottom:1rem;}

.team-score-row{display:flex; justify-content:space-between; align-items:center; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:.75rem 1rem; margin-bottom:1.1rem; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:.92rem;}
.team-score-row .vs{color:var(--dim); font-size:.72rem;}
.timer-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:3.6rem; text-align:center; margin:.4rem 0; color:var(--accent); font-variant-numeric:tabular-nums; text-shadow:0 0 15px rgba(139,92,246,0.4);}
.team-col{background:var(--surface2); border:1px solid var(--border); border-radius:11px; padding:.75rem .85rem; margin-bottom:.6rem; font-size:.85rem; color:var(--dim);}
.team-col h4{margin:0 0 .3rem; font-family:'Space Grotesk',sans-serif; font-size:.88rem; color:var(--text);}
.stepper{display:flex; align-items:center; justify-content:center; gap:1.1rem; margin:.7rem 0 1rem;}
.stepper button{width:44px; height:44px; border-radius:12px; border:1px solid var(--border-strong); background:var(--surface2); color:var(--text); font-size:1.3rem; cursor:pointer; font-family:'Space Grotesk',sans-serif;}
.stepper .req-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.6rem; min-width:2.6rem; text-align:center; color:var(--secondary);}

.impostor-card.red{border-color:rgba(239,68,68,0.5); background:rgba(239,68,68,0.12);}

#confetti-layer{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden;}
.confetto{position:absolute; top:-5%; font-size:1.3rem; opacity:0; animation:confFall 1.6s ease-in forwards;}
@keyframes confFall{
  0%{opacity:1; transform:translateY(0) rotate(0deg);}
  100%{opacity:0; transform:translateY(110vh) rotate(500deg);}
}

.foot-actions{display:flex; gap:.6rem; margin-top:1.2rem;}
</style>

/* ---------- utils ---------- */
const ACCENTS = ['#E0294B','#B0203A','#3F9D5D','#8B5A2B','#C2185B','#5C3A1E'];
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function colorFor(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return ACCENTS[h%ACCENTS.length]; }
function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function storageGet(key, shared){
  if(!db) return null;
  try{
    const snap = await db.ref(key).once('value');
    if(!snap.exists()) return null;
    return { key, value: snap.val(), shared };
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(!db) return null;
  try{
    await db.ref(key).set(value);
    return { key, value, shared };
  }catch(e){ console.error('storage.set failed', e); return null; }
}
async function storageList(prefix, shared){
  if(!db) return { keys: [] };
  try{
    const snap = await db.ref().orderByKey().startAt(prefix).endAt(prefix + '\uf8ff').once('value');
    const keys = [];
    snap.forEach(child=>{ keys.push(child.key); });
    return { keys };
  }catch(e){ return { keys: [] }; }
}

const CONFETTI_EMOJI = ['🍒','🍒','🍒','🍃'];
function burstConfetti(n){
  const layer = document.getElementById('confetti-layer');
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className='confetto';
    el.textContent = CONFETTI_EMOJI[Math.floor(Math.random()*CONFETTI_EMOJI.length)];
    el.style.left = (Math.random()*100)+'%';
    el.style.fontSize = (1+Math.random()*.7)+'rem';
    el.style.animationDelay = (Math.random()*.4)+'s';
    el.style.animationDuration = (1.2+Math.random()*.8)+'s';
    layer.appendChild(el);
    setTimeout(()=>el.remove(), 2200);
  }
}

function getTopPromptText(idx, filterCat){
  let pool = TOP;

    const filtered = TOP.filter(t => t.cat === filterCat);
    if(filtered.length > 0) pool = filtered;
  }
  const item = pool[idx % pool.length];
  return item.text || item;
}

function randomDuvidoCategory(){
  const g = room ? room.gameData : null;
  const filterCat = (g && g.filterCat) ? g.filterCat : 'todos';
  let pool = [];
  if(filterCat === 'todos' || !CATEGORIES[filterCat]){
    pool = Object.values(CATEGORIES).flat();
  } else {
    pool = CATEGORIES[filterCat];
  }
  if(!pool || pool.length === 0) pool = Object.values(CATEGORIES).flat();

  const roomUsed = (g && Array.isArray(g.usedDuvidoCategories)) ? g.usedDuvidoCategories : [];

  let available = pool.filter(c => !roomUsed.includes(c));
  if(available.length === 0){
    available = pool;
    if(g && room) g.usedDuvidoCategories = [];
  }

  const pick = available[Math.floor(Math.random() * available.length)];

  if(g && room){
    if(!g.usedDuvidoCategories) g.usedDuvidoCategories = [];
    if(!g.usedDuvidoCategories.includes(pick)){
      g.usedDuvidoCategories.push(pick);
    }
  }

  return pick;
}

function randomQuemSouCharacter(usedInRound = []){
  const g = room ? room.gameData : null;
  const filterCat = (g && g.filterCat) ? g.filterCat : 'todos';
  let pool = CHARACTER_BANK;
  if(filterCat !== 'todos'){
    const filtered = CHARACTER_BANK.filter(c => c && c.cat === filterCat);
    if(filtered.length > 0) pool = filtered;
  }
  if(!pool || pool.length === 0) pool = CHARACTER_BANK;

  const roomUsed = (g && Array.isArray(g.usedCharacters)) ? g.usedCharacters : [];

  let available = pool.filter(c => !roomUsed.includes(c.name) && !usedInRound.includes(c.name));
  if(available.length === 0){
    available = pool.filter(c => !usedInRound.includes(c.name));
    if(g && room) g.usedCharacters = [];
  }
  if(available.length === 0) available = pool;

  const pick = available[Math.floor(Math.random() * available.length)];
  const name = (typeof pick === 'object' && pick !== null) ? (pick.name || String(pick)) : String(pick || 'Personagem Misterioso');

  if(g && room){
    if(!g.usedCharacters) g.usedCharacters = [];
    if(!g.usedCharacters.includes(name)){
      g.usedCharacters.push(name);
    }
  }
  return name;
}

function getTwoRandomQuemSouCharacters(usedInRound = []){
  let charA = randomQuemSouCharacter(usedInRound);
  let charB = randomQuemSouCharacter([...usedInRound, charA]);
  let attempts = 0;
  while(charA === charB && attempts < 15){
    charB = randomQuemSouCharacter([...usedInRound, charA]);
    attempts++;
  }
  return { charA, charB };
}

  const roomUsed = (g && Array.isArray(g.usedTop10Themes)) ? g.usedTop10Themes : [];

  let available = pool.filter(t => !roomUsed.includes(t.theme));
  if(available.length === 0){
    available = pool;
    if(g && room) g.usedTop10Themes = [];
  }

  const pick = available[Math.floor(Math.random() * available.length)];

  if(g && room){
    if(!g.usedTop10Themes) g.usedTop10Themes = [];
    if(!g.usedTop10Themes.includes(pick.theme)){
      g.usedTop10Themes.push(pick.theme);
    }
  }

  return pick;
}

/* ---------- keys ---------- */
const roomKey = c => `room:${c}`;
const ansKey = (c,r,p) => `room:${c}:ans:${r}:${p}`;
const ansPrefix = (c,r) => `room:${c}:ans:${r}:`;

/* ---------- room persistence helpers ---------- */
async function updateRoom(mutator){
  const res = await storageGet(roomKey(roomCode), true);
  let r = res ? (typeof res.value === 'string' ? JSON.parse(res.value) : res.value) : room;
  mutator(r);
  r.updatedAt = Date.now();
  await storageSet(roomKey(roomCode), JSON.stringify(r), true);
  room = r; lastRoomJSON = JSON.stringify(r);
  render();
}

async function createRoom(name){
  me.id = uid(); me.name = name.trim();
  const code = genCode();
  const r = { code, hostId: me.id, players:[{id:me.id, name:me.name, score:0}],
    phase:'lobby', activeGame:null, gameData:{}, createdAt:Date.now(), updatedAt:Date.now() };
  await storageSet(roomKey(code), JSON.stringify(r), true);
  roomCode = code; room = r; lastRoomJSON = JSON.stringify(r);
  startPolling(); render();
}

async function joinRoom(code, name){
  code = code.toUpperCase().trim();
  const res = await storageGet(roomKey(code), true);
  if(!res){ joinError = 'Sala não encontrada. Confira o código.'; render(); return; }
  let r = typeof res.value === 'string' ? JSON.parse(res.value) : res.value;
  me.id = uid(); me.name = name.trim();
  if(!r.players.find(p=>p.id===me.id)) r.players.push({id:me.id, name:me.name, score:0});
  r.updatedAt = Date.now();
  await storageSet(roomKey(code), JSON.stringify(r), true);
  roomCode = code; room = r; lastRoomJSON = JSON.stringify(r); joinError='';
  startPolling(); render();
}

function leaveRoom(){
  stopPolling();
  clearDuvidoTicker();
  roomCode = null; room = null; lastRoomJSON = null; homeMode = null;
  formLocked = false;
  render();
}

function startPolling(){
  stopPolling();
  if(db && roomCode){
    try {
      const ref = db.ref(roomKey(roomCode));
      roomListener = snap => {
        if(!snap.exists()) return;
        const val = snap.val();
        const parsed = typeof val === 'string' ? JSON.parse(val) : val;
        const jsonStr = JSON.stringify(parsed);
        if(jsonStr !== lastRoomJSON){
          lastRoomJSON = jsonStr;
          room = parsed;
          if(formLocked) updateFormStatus(); else render();
        } else if(!formLocked){
          refreshLiveCount();
        }
      };
      ref.on('value', roomListener);
    } catch(e) { console.error('Firebase realtime listener error', e); }
  }
  pollHandle = setInterval(pollRoom, 1500);
  pollRoom();
}

function stopPolling(){
  if(pollHandle){ clearInterval(pollHandle); pollHandle = null; }
  if(db && roomCode && roomListener){
    try { db.ref(roomKey(roomCode)).off('value', roomListener); } catch(e){}
    roomListener = null;
  }
}

async function pollRoom(){
  if(!roomCode) return;
  const res = await storageGet(roomKey(roomCode), true);
  if(!res) return;
  const parsed = typeof res.value === 'string' ? JSON.parse(res.value) : res.value;
  const jsonStr = JSON.stringify(parsed);
  if(jsonStr !== lastRoomJSON){
    lastRoomJSON = jsonStr;
    room = parsed;
    if(formLocked) updateFormStatus(); else render();
  } else if(!formLocked){
    await refreshLiveCount();
  }
}

async function refreshLiveCount(){
  if(!room || room.phase!=='game') return;
  const g = room.gameData || {};
  let prefix = null, total = room.players.length, label = 'responderam';
  if(room.activeGame==='top' && g.roundId && !g.revealed){
    prefix = ansPrefix(roomCode, g.roundId);
  } else if(room.activeGame==='impostor' && g.stage==='vote'){
    prefix = ansPrefix(roomCode, 'imp'+g.roundId); label = 'votaram';
  }
  if(!prefix) return;
  const listRes = await storageList(prefix, true);
  const newCount = listRes.keys.length;
  if(newCount !== liveCount.answered){
    liveCount = { answered:newCount, total };
    const el = document.getElementById('live-count-text');
    if(el) el.textContent = `${newCount}/${total} ${label}`;
  }
}

async function startGame(gameId){
  clearDuvidoTicker();
  formLocked = false; selectedVote=null;
  duvidoCountDraft=5;
  impostorVoted=false; selectedImpostorVote=null;
  quizDraftQuestions=[];
  await updateRoom(r=>{
    r.phase='game';
    r.activeGame=gameId;
    const filterCat = (r.gameData && r.gameData.filterCat) || 'todos';
    if(gameId==='top'){
      r.gameData = { roundId:1, filterCat, idx:0, promptText: getTopPromptText(0, filterCat), revealed:false, results:null };
    } else if(gameId==='quemsou'){
      let teamA = (r.gameData && r.gameData.teamA && r.gameData.teamA.length > 0) ? [...r.gameData.teamA] : [];
      let teamB = (r.gameData && r.gameData.teamB && r.gameData.teamB.length > 0) ? [...r.gameData.teamB] : [];
      const activeIds = (r.players || []).map(p => p.id);
      teamA = teamA.filter(id => activeIds.includes(id));
      teamB = teamB.filter(id => activeIds.includes(id));
      activeIds.forEach((pid) => {
        if (!teamA.includes(pid) && !teamB.includes(pid)) {
          if (teamA.length <= teamB.length) teamA.push(pid); else teamB.push(pid);
        }
      });
      r.gameData = { stage:'teams', mode:'teams', filterCat, teamA, teamB, turnIdxA:0, turnIdxB:0, playerAId:null, playerBId:null, characterA:null, characterB:null, individualChars:{} };
    } else if(gameId==='duvido'){
      let teamA = (r.gameData && r.gameData.teamA && r.gameData.teamA.length > 0) ? [...r.gameData.teamA] : [];
      let teamB = (r.gameData && r.gameData.teamB && r.gameData.teamB.length > 0) ? [...r.gameData.teamB] : [];
      const activeIds = (r.players || []).map(p => p.id);
      teamA = teamA.filter(id => activeIds.includes(id));
      teamB = teamB.filter(id => activeIds.includes(id));
      activeIds.forEach((pid) => {
        if (!teamA.includes(pid) && !teamB.includes(pid)) {
          if (teamA.length <= teamB.length) teamA.push(pid); else teamB.push(pid);
        }
      });
      r.gameData = { stage:'teams', filterCat, teamA, teamB, timeLimit:60, turnTeam:'A', turnIdxA:0, turnIdxB:0,
        playerAId:null, playerBId:null, currentPlayerId:null, category:null, required:null, challengerId:null,
        timerStartedAt:null, success:null, scoreA:0, scoreB:0 };
    } else if(gameId==='impostor'){
      r.gameData = { stage:'idle', filterCat, roundId:0, majorityWord:null, impostorWord:null, clue:null, impostorId:null, results:null };
    } else if(gameId==='top10'){
      r.gameData = { stage:'idle', filterCat, themeIndex:null, theme:null, answers:null, readerId:null };
    } else if(gameId==='quiz'){
      r.gameData = { stage:'setup', filterCat, questions:[], currentIndex:0, revealed:false };
    }
  });
}

async function revealTopRound(){
  const g = room.gameData;
  const listRes = await storageList(ansPrefix(roomCode, g.roundId), true);
  const keys = listRes.keys || [];
  const counts = {};
  for(const k of keys){
    const v = await storageGet(k, true);
    if(!v) continue;
    counts[v.value] = (counts[v.value]||0)+1;
  }
  const results = room.players.map(p=>({name:p.name, count:counts[p.id]||0})).sort((a,b)=>b.count-a.count);
  await updateRoom(r=>{ r.gameData.revealed=true; r.gameData.results=results; });
  burstConfetti(24);
}

    g.promptText = getTopPromptText(g.idx, g.filterCat);

}

async function cycleQuemSouTeam(pid){
  await updateRoom(r=>{
    const g = r.gameData || {};
    if(!g.teamA) g.teamA = [];
    if(!g.teamB) g.teamB = [];
    if(g.teamA.includes(pid)){ g.teamA = g.teamA.filter(x=>x!==pid); g.teamB.push(pid); }
    else if(g.teamB.includes(pid)){ g.teamB = g.teamB.filter(x=>x!==pid); }
    else { g.teamA.push(pid); }
  });
}

async function startQuemSouBattle(){
  await updateRoom(r=>{
    const g = r.gameData || {};
    const mode = g.mode || 'teams';
    g.mode = mode;
    g.stage = 'play';

    if(mode === 'individual'){
      const individualChars = {};
      const usedInRound = [];
      (r.players || []).forEach(p => {
        const char = randomQuemSouCharacter(usedInRound);
        usedInRound.push(char);
        individualChars[p.id] = char;
      });
      g.individualChars = individualChars;
    } else {
      if(!g.teamA) g.teamA = [];
      if(!g.teamB) g.teamB = [];
      const activeIds = (r.players || []).map(p => p.id);
      g.teamA = g.teamA.filter(id => activeIds.includes(id));
      g.teamB = g.teamB.filter(id => activeIds.includes(id));
      activeIds.forEach(pid => {
        if(!g.teamA.includes(pid) && !g.teamB.includes(pid)){
          if(g.teamA.length <= g.teamB.length) g.teamA.push(pid);
          else g.teamB.push(pid);
        }
      });

      g.turnIdxA = g.turnIdxA || 0;
      g.turnIdxB = g.turnIdxB || 0;
      g.playerAId = g.teamA[g.turnIdxA % g.teamA.length] || (r.players[0] ? r.players[0].id : null);
      g.playerBId = g.teamB[g.turnIdxB % g.teamB.length] || (r.players[1] ? r.players[1].id : g.playerAId);

      const { charA, charB } = getTwoRandomQuemSouCharacters();
      g.characterA = charA;
      g.characterB = charB;
    }
  });
  burstConfetti(18);
}

async function nextQuemSouRound(){
  await updateRoom(r=>{
    const g = r.gameData || {};
    const mode = g.mode || 'teams';

    if(mode === 'individual'){
      const individualChars = {};
      const usedInRound = [];
      (r.players || []).forEach(p => {
        const char = randomQuemSouCharacter(usedInRound);
        usedInRound.push(char);
        individualChars[p.id] = char;
      });
      g.individualChars = individualChars;
      g.stage = 'play';
    } else {
      if (!g.teamA || g.teamA.length === 0) g.teamA = (r.players || []).map(p=>p.id);
      if (!g.teamB || g.teamB.length === 0) g.teamB = (r.players || []).map(p=>p.id);

      g.turnIdxA = ((g.turnIdxA || 0) + 1) % g.teamA.length;
      g.turnIdxB = ((g.turnIdxB || 0) + 1) % g.teamB.length;
      g.playerAId = g.teamA[g.turnIdxA % g.teamA.length];
      g.playerBId = g.teamB[g.turnIdxB % g.teamB.length];

      const { charA, charB } = getTwoRandomQuemSouCharacters();
      g.characterA = charA;
      g.characterB = charB;
      g.stage = 'play';
    }
  });
  burstConfetti(18);
}

  await updateRoom(r=>{
    const g = r.gameData || {};
    if(g.currentBid){
      g.required = g.currentBid.count;
      g.currentPlayerId = g.currentBid.playerId;
      g.challengerId = me.id;
      g.timerStartedAt = null;
    }
  });
}

async function resetDuvidoTeams(){
  await updateRoom(r=>{
    if(r.gameData) r.gameData.stage = 'teams';
  });
}

async function startDuvidoBattle(){
  clearDuvidoTicker();
  duvidoDraftA = 4;
  duvidoDraftB = 4;
  await updateRoom(r=>{
    const g = r.gameData || {};
    if(!g.teamA) g.teamA = [];
    if(!g.teamB) g.teamB = [];
    const activeIds = (r.players || []).map(p => p.id);
    g.teamA = g.teamA.filter(id => activeIds.includes(id));
    g.teamB = g.teamB.filter(id => activeIds.includes(id));
    activeIds.forEach(pid => {
      if(!g.teamA.includes(pid) && !g.teamB.includes(pid)){
        if(g.teamA.length <= g.teamB.length) g.teamA.push(pid);
        else g.teamB.push(pid);
      }
    });

    g.stage = 'challenge';
    g.turnIdxA = 0;
    g.turnIdxB = 0;
    g.playerAId = g.teamA[0] || (r.players[0] ? r.players[0].id : null);
    g.playerBId = g.teamB[0] || (r.players[1] ? r.players[1].id : g.playerAId);
    g.category = randomDuvidoCategory();
    g.currentBid = null;
    g.required = null;
    g.currentPlayerId = null;
    g.challengerId = null;
    g.timerStartedAt = null;
    g.success = null;
    g.scoreA = 0;
    g.scoreB = 0;
  });
  burstConfetti(18);
}

async function startDuvidoTimer(){
  await updateRoom(r=>{ if (r.gameData) r.gameData.timerStartedAt = Date.now(); });
}

async function markDuvidoResult(success){
  clearDuvidoTicker();
  await updateRoom(r=>{
    const g = r.gameData || {};
    g.stage = 'result';
    g.success = success;
    const targetTeam = teamOf(g.currentPlayerId) || 'A';
    if(success){
      if(targetTeam==='A') g.scoreA = (g.scoreA||0) + 1; else g.scoreB = (g.scoreB||0) + 1;
      const pl = (r.players || []).find(p=>p.id===g.currentPlayerId);
      if(pl) pl.score = (pl.score||0)+1;
    } else {
      const challengerTeam = targetTeam==='A' ? 'B' : 'A';
      if(challengerTeam==='A') g.scoreA = (g.scoreA||0) + 1; else g.scoreB = (g.scoreB||0) + 1;
      const ch = (r.players || []).find(p=>p.id===g.challengerId);
      if(ch) ch.score = (ch.score||0)+1;
    }
  });
  burstConfetti(success ? 24 : 10);
}

async function nextDuvidoTurn(){
  clearDuvidoTicker();
  duvidoDraftA = 4;
  duvidoDraftB = 4;
  await updateRoom(r=>{
    const g = r.gameData || {};
    if(!g.teamA || g.teamA.length === 0) g.teamA = (r.players || []).map(p=>p.id);
    if(!g.teamB || g.teamB.length === 0) g.teamB = (r.players || []).map(p=>p.id);

    g.turnIdxA = ((g.turnIdxA||0)+1) % g.teamA.length;
    g.turnIdxB = ((g.turnIdxB||0)+1) % g.teamB.length;

    g.playerAId = g.teamA[g.turnIdxA % g.teamA.length];
    g.playerBId = g.teamB[g.turnIdxB % g.teamB.length];

    g.category = randomDuvidoCategory();
    g.currentBid = null;
    g.required = null;
    g.currentPlayerId = null;
    g.challengerId = null;
    g.timerStartedAt = null;
    g.success = null;
    g.stage = 'challenge';
  });
}

function impostorScreen(){
  const g = room.gameData;
  if(g.stage==='idle'){
    return `
      <p class="sub">Todo mundo recebe a mesma palavra secreta — só uma pessoa (o impostor) recebe outra palavra parecida, com uma dica de socorro. Dêem pistas em voz alta sem falar a palavra e descubram quem é o impostor!</p>
      ${renderCategoryFilterHTML(g.filterCat)}
      ${isHost() ? `<button class="btn btn-primary" onclick="startImpostorRound()">Sortear e começar</button>` : `<p class="hint">Esperando o anfitrião(a) começar...</p>`}
    `;
  }
  if(g.stage==='reveal'){
    const amImpostor = me.id===g.impostorId;
    return `
      <div class="card ${amImpostor?'impostor-card red':''} center">
        ${amImpostor ? `
          <p style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem; color:#B0203A; margin:.2rem 0 .5rem;">Você é o IMPOSTOR</p>
          <p class="hint" style="margin-bottom:.3rem;">Sua palavra secreta falsa é</p>
          <p style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.5rem; color:#B0203A; margin-bottom:.5rem;">${esc(g.impostorWord || '---')}</p>
          <p class="hint" style="font-style:italic;">Dica de socorro: ${esc(g.clue || '---')}. Use isso pra bolar pistas que combinem!</p>
        ` : `
          <p class="hint" style="margin-bottom:.3rem;">Sua palavra secreta é</p>
          <p style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.5rem;">${esc(g.majorityWord || '---')}</p>
        `}
      </div>
      <p class="hint mb">Dê pistas sobre sua palavra sem falar ela. Quem não souber a palavra certa pode estar disfarçando!</p>
      ${isHost() ? `<button class="btn btn-primary" onclick="openImpostorDiscuss()">Abrir discussão</button>` : `<p class="hint">Esperando o anfitrião(a)...</p>`}
    `;
  }
  if(g.stage==='discuss'){
    return `
      <div class="prompt-box">
        <div class="eyebrow">Discussão</div>
        <div class="prompt-text">Cada um dá uma dica sobre a palavra. Sem falar ela!</div>
      </div>
      ${isHost() ? `<button class="btn btn-primary" onclick="openImpostorVote()">Abrir votação</button>` : `<p class="hint">Esperando o anfitrião(a) abrir a votação...</p>`}
    `;
  }
  if(g.stage==='vote'){
    if(impostorVoted){
      return `
        <div class="prompt-box"><div class="eyebrow">Voto registrado</div><div class="prompt-text">Esperando o resto da galera votar</div></div>
        <div class="status-line" id="live-count-text">${liveCount.answered}/${liveCount.total} votaram</div>
        ${isHost() ? `<button class="btn btn-primary" onclick="revealImpostor()">Revelar resultado</button>` : ''}
      `;
    }
    return `
      <p class="sub">Quem você acha que é o impostor?</p>
      <div class="chip-row mb">${room.players.filter(p=>p.id!==me.id).map(p=>`<div class="pick-chip" onclick="voteImpostor('${p.id}')">${esc(p.name)}</div>`).join('')}</div>
    `;
  }
  const res = g.results || {list:[], crewWon:false};
  const max = Math.max(1, ...res.list.map(x=>x.count));
  return `
    <div class="card">
      ${res.list.map(x=>`
        <div class="result-row">
          <div style="flex:1;">
            <div class="result-name">${esc(x.name)}${x.id===g.impostorId?' 🎭':''}</div>

        </div>`).join('')}

    <div class="prompt-box">
      <div class="eyebrow">${res.crewWon ? 'A galera venceu!' : 'O impostor escapou!'}</div>
      <div class="prompt-text" style="font-size:1rem;">Palavra: ${esc(g.majorityWord)} · Impostor tinha: ${esc(g.impostorWord)}</div>

    ${isHost() ? `<button class="btn btn-primary" onclick="startImpostorRound()">Nova rodada</button>` : `<p class="hint">Esperando a próxima rodada...</p>`}
  `;
}
async function startImpostorRound(){
  const g = (room && room.gameData) ? room.gameData : {};
  const filterCat = g.filterCat || 'todos';
  const pair = randomImpostorPair();
  const impostorPlayer = room.players[Math.floor(Math.random()*room.players.length)];
  impostorVoted = false; selectedImpostorVote = null;
  const swap = Math.random() < 0.5;
  const majWord = swap ? pair.word2 : pair.word1;
  const impWord = swap ? pair.word1 : pair.word2;

  await updateRoom(r=>{
    const prevRound = (r.gameData && r.gameData.roundId) || 0;
    r.gameData = {
      stage: 'reveal',
      filterCat: filterCat,
      roundId: prevRound + 1,
      majorityWord: majWord,
      impostorWord: impWord,
      clue: pair.clue,
      impostorId: impostorPlayer.id,
      results: null
    };
  });
}
async function openImpostorDiscuss(){ await updateRoom(r=>{ r.gameData.stage='discuss'; }); }
async function openImpostorVote(){
  impostorVoted = false; selectedImpostorVote = null;
  liveCount = { answered:0, total: room.players.length };
  await updateRoom(r=>{ r.gameData.stage='vote'; });
}
async function voteImpostor(pid){
  impostorVoted = true; selectedImpostorVote = pid; render();
  await storageSet(ansKey(roomCode, 'imp'+room.gameData.roundId, me.id), pid, true);
}
async function revealImpostor(){
  const g = room.gameData;
  const listRes = await storageList(ansPrefix(roomCode, 'imp'+g.roundId), true);
  const counts = {};
  for(const k of listRes.keys){
    const v = await storageGet(k, true);
    if(!v) continue;
    counts[v.value] = (counts[v.value]||0)+1;
  }
  const results = room.players.map(p=>({id:p.id, name:p.name, count:counts[p.id]||0})).sort((a,b)=>b.count-a.count);
  const topVoted = results[0];
  const crewWon = !!(topVoted && topVoted.count>0 && topVoted.id===g.impostorId);
  await updateRoom(r=>{
    r.gameData.stage='result';
    r.gameData.results={list:results, crewWon};
    if(crewWon){
      r.players.forEach(p=>{ if(p.id!==r.gameData.impostorId) p.score=(p.score||0)+1; });
    } else {
      const imp = r.players.find(p=>p.id===r.gameData.impostorId);
      if(imp) imp.score=(imp.score||0)+2;
    }
  });
  burstConfetti(26);
}

/* ---------- Top 10 ---------- */
function top10Screen(){
  const g = room.gameData;
  const isReader = me.id===g.readerId;
  if(g.stage==='idle'){
    return `
      <p class="sub">O app sorteia um tema e escolhe quem vai ler. Só quem lê enxerga a lista das 10 respostas certas — o resto joga de cabeça, falando itens em voz alta. Se alguém duvidar de uma resposta, quem está lendo confere na hora.</p>
      ${renderCategoryFilterHTML(g.filterCat)}
      ${isHost() ? `<button class="btn btn-primary" onclick="startTop10Round()">Sortear tema e leitor</button>` : `<p class="hint">Esperando o anfitrião(a) começar...</p>`}
    `;
  }
  if(g.stage==='active' || g.stage==='revealed'){
    const readerName = (room.players.find(p=>p.id===g.readerId)||{}).name || '???';
    let inner = '';
    if(g.stage==='revealed'){
      inner += `
        <div class="prompt-box"><div class="eyebrow">Tema</div><div class="prompt-text">${esc(g.theme)}</div></div>
        <div class="card">
          <label class="field-label">As 10 respostas</label>
          <ol style="margin:.4rem 0 0; padding-left:1.2rem; line-height:1.9;">
            ${g.answers.map(a=>`<li>${esc(a)}</li>`).join('')}
          </ol>
        </div>
      `;
    } else if(isReader){
      inner += `
        <div class="card">
          <label class="field-label">Só você vê isso — leitor(a) da rodada</label>
          <p style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.1rem; margin:.3rem 0 .8rem;">${esc(g.theme)}</p>
          <ol style="margin:0; padding-left:1.2rem; line-height:1.9;">
            ${g.answers.map(a=>`<li>${esc(a)}</li>`).join('')}
          </ol>
        </div>
        <p class="hint">Não fale as respostas! Só confira quando alguém for desafiado com "duvido!".</p>
      `;
    } else {
      inner += `
        <div class="prompt-box">
          <div class="eyebrow">Tema de hoje</div>
          <div class="prompt-text">${esc(g.theme)}</div>
        </div>
        <p class="hint">Falem itens em voz alta! Se acharem que alguém errou, gritem "Duvido!" — ${esc(readerName)} confere na lista.</p>
      `;
    }
    if(isHost()){
      inner += `<div class="btn-row" style="margin-top:.6rem;">`;
      if(g.stage!=='revealed') inner += `<button class="btn btn-outline" onclick="revealTop10()">Mostrar lista</button>`;
      inner += `<button class="btn btn-primary" onclick="startTop10Round()">Nova rodada</button>`;
      inner += `</div>`;
    }
    return inner;
  }
  return '';
}
async function startTop10Round(){
  const g = (room && room.gameData) ? room.gameData : {};
  const filterCat = g.filterCat || 'todos';
  const pick = randomTop10Theme();
  const reader = room.players[Math.floor(Math.random()*room.players.length)];
  await updateRoom(r=>{
    const used = (r.gameData && Array.isArray(r.gameData.usedTop10Themes)) ? r.gameData.usedTop10Themes : [];
    if(!used.includes(pick.theme)) used.push(pick.theme);
    r.gameData = {
      stage: 'active',
      filterCat: filterCat,
      theme: pick.theme,
      answers: pick.answers,
      readerId: reader.id,
      usedTop10Themes: used
    };
  });
}
async function revealTop10(){
  await updateRoom(r=>{ r.gameData.stage='revealed'; });
  burstConfetti(16);
}

/* ---------- Quiz ---------- */
function quizScreen(){
  const g = room.gameData;
  if(g.stage==='setup') return quizSetupScreen();
  if(g.stage==='play') return quizPlayScreen();
  return '';
}
function quizSetupScreen(){
  if(!isHost()){
    return `<p class="sub">A pessoa que sabe as respostas certas está montando o quiz. Só um instante...</p>`;
  }
  const addedTexts = quizDraftQuestions.map(x=>x.q);
  const remaining = QUIZ_SUGGESTIONS.filter(q=>!addedTexts.includes(q));
  return `
    <p class="sub">Monte o quiz. Toque numa sugestão pra adicionar (ou escreva a sua) e preencha a resposta certa de cada uma.</p>
    ${remaining.length ? `
      <label class="field-label">Sugestões de pergunta</label>
      <div class="chip-row mb">${remaining.map(q=>`<div class="pick-chip" onclick="addQuizSuggestion('${q.replace(/'/g,"\\'")}')">${esc(q)}</div>`).join('')}</div>
    ` : ''}
    <label class="field-label">Sua pergunta</label>
    <input type="text" id="quiz-custom-q" maxlength="140" placeholder="Escreva uma pergunta para o quiz...">
    <button class="btn btn-outline" onclick="addQuizCustom()">Adicionar pergunta</button>
    ${quizDraftQuestions.length ? `
      <label class="field-label" style="margin-top:1rem;">Perguntas do quiz (${quizDraftQuestions.length})</label>
      ${quizDraftQuestions.map((item,i)=>`
        <div class="card" style="margin-bottom:.6rem;">
          <p style="font-weight:600; font-size:.9rem; margin:0 0 .55rem;">${i+1}. ${esc(item.q)}</p>
          <input type="text" placeholder="Resposta certa" value="${esc(item.a)}" oninput="updateQuizAnswer(${i}, this.value)">
          <button class="btn btn-ghost btn-sm" onclick="removeQuizQuestion(${i})">Remover</button>
        </div>
      `).join('')}
    ` : ''}
    <button class="btn btn-primary" ${quizDraftQuestions.length<1?'disabled':''} onclick="startQuizPlay()">Começar quiz</button>
  `;
}
function addQuizSuggestion(q){
  if(!quizDraftQuestions.find(x=>x.q===q)) quizDraftQuestions.push({q, a:''});
  render();
}
function addQuizCustom(){
  const el = document.getElementById('quiz-custom-q');
  const val = el.value.trim();
  if(!val) return;
  quizDraftQuestions.push({q:val, a:''});
  render();
}
function updateQuizAnswer(i, val){ if(quizDraftQuestions[i]) quizDraftQuestions[i].a = val; }
function removeQuizQuestion(i){ quizDraftQuestions.splice(i,1); render(); }
async function startQuizPlay(){
  const filled = quizDraftQuestions.every(q=>q.a && q.a.trim());
  if(!filled){ alert('Preencha a resposta certa de todas as perguntas antes de começar.'); return; }
  const questions = quizDraftQuestions.map(q=>({q:q.q, a:q.a.trim()}));
  await updateRoom(r=>{ r.gameData = { stage:'play', questions, currentIndex:0, revealed:false }; });
}
function quizPlayScreen(){
  const g = room.gameData;
  const item = g.questions[g.currentIndex];
  let inner = `<div class="status-line">Pergunta ${g.currentIndex+1} de ${g.questions.length}</div>`;
  inner += `<div class="prompt-box"><div class="eyebrow">Quem sabe a resposta certa?</div><div class="prompt-text">${esc(item.q)}</div></div>`;
  if(!g.revealed){
    inner += `<p class="hint mb">Gritem os palpites! Quando todo mundo já chutou, o anfitrião revela a resposta certa.</p>`;
    if(isHost()) inner += `<button class="btn btn-primary" onclick="revealQuizAnswer()">Revelar resposta</button>`;
    else inner += `<p class="hint">Esperando o anfitrião(a) revelar...</p>`;
  } else {
    inner += `<div class="card center"><label class="field-label">Resposta certa</label><p style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem; margin:.3rem 0 0;">${esc(item.a)}</p></div>`;
    if(isHost()){
      inner += `<p class="hint mb">Quem acertou? Toque nos nomes pra dar ponto.</p>`;
      inner += `<div class="chip-row mb">${room.players.map(p=>`<div class="pick-chip" onclick="awardQuizPoint('${p.id}')">${esc(p.name)}</div>`).join('')}</div>`;
      inner += (g.currentIndex+1 < g.questions.length)
        ? `<button class="btn btn-primary" onclick="nextQuizQuestion()">Próxima pergunta</button>`
        : `<button class="btn btn-primary" onclick="finishQuiz()">Ver placar final</button>`;
    } else {
      inner += `<p class="hint">Esperando a próxima pergunta...</p>`;
    }
  }
  return inner;
}
async function revealQuizAnswer(){ await updateRoom(r=>{ r.gameData.revealed=true; }); burstConfetti(18); }
async function awardQuizPoint(pid){
  await updateRoom(r=>{ const pl = r.players.find(p=>p.id===pid); if(pl) pl.score=(pl.score||0)+1; });
  burstConfetti(10);
}
async function nextQuizQuestion(){
  await updateRoom(r=>{ r.gameData.currentIndex += 1; r.gameData.revealed=false; });
}
async function finishQuiz(){ await updateRoom(r=>{ r.phase='scoreboard'; }); }

/* ---------- init ---------- */
render();
</script>
</body>
</html>
